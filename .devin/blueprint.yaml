# https://docs.devin.ai/onboard-devin/environment-yaml
# One-time setup (e.g., install system tools, global CLIs).
initialize:
  - uses: github.com/actions/setup-node@v4
    with:
      node-version: "24"
  - name: install CJK fonts
    run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  npm install
knowledge:
  - name: test
    contents: |
      # npm test (vitest unit + scale performance tests)
  - name: typecheck
    contents: |
      # npm run typecheck (extension + agent workspaces)
  - name: build
    contents: |
      # npm run build -> extension/dist (load as unpacked Chrome extension)
  - name: check
    contents: |
      # npm run check = check:docs + check:architecture + typecheck + test + build; check:docs alone for doc-only changes
  - name: extension-tryout
    contents: |
      # google-chrome --user-data-dir=<profile> --load-extension=extension/dist --remote-debugging-port=<port>; open side panel with Ctrl+Shift+Y; settings at chrome-extension://<id>/settings.html
---
# macOS: real-site evals run on Mac Chrome, closer to the user's daily setup. The image ships Chrome and Homebrew.
runs-on: macos
initialize:
  - uses: github.com/actions/setup-node@v4
    with:
      node-version: "24"
  # Same command name as the Linux image, so acceptance scripts need no per-platform Chrome path.
  - name: google-chrome on PATH
    run: ln -sf "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" /opt/homebrew/bin/google-chrome
maintenance: |
  npm install
