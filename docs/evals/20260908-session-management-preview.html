:ellipsis}.workspace{display:grid;grid-template-columns:minmax(150px,1fr) 310px;min-height:0;flex:1}.page{padding:26px 20px;background:#fff;position:relative;overflow:auto}.site{font-size:10px;letter-spacing:.09em;color:#999fa6;margin-bottom:24px}.page h2{font-size:22px;font-weight:550;letter-spacing:-.4px;margin:0 0 6px}.page .subtitle{font-size:11px;color:#9298a1;margin:0 0 27px}.field{margin:24px 0 30px;position:relative}.field label{display:block;font-size:11px;color:#777e88;margin-bottom:9px}.value{min-height:76px;font-size:12px;line-height:1.75;border:1px solid #e7e9ec;border-radius:7px;padding:12px;color:#7e8793;white-space:pre-wrap;transition:border-color .2s,background .2s}.value.filled{color:#374151}.value.red{border-color:#dd7774;background:#fffafa}.value.green{border-color:#5d9c7e;background:#f8fcfa}.page-foot{font-size:10px;color:#9298a1;line-height:1.6;margin-top:25px}.pointer{position:absolute;right:4px;bottom:-20px;display:flex;align-items:center;color:#c95454;filter:drop-shadow(0 2px 2px #0001);font-size:9px;white-space:nowrap;z-index:1}.pointer.green{color:#32825d}.pointer svg{width:16px;height:21px;transform:rotate(-15deg);margin-right:3px;fill:currentColor;stroke:white;stroke-width:1.2}.pointer span{background:currentColor;border-radius:4px;padding:3px 5px}.pointer em{font-style:normal;color:white}.panel{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid #e0e4e9;background:radial-gradient(at 15% 15%,#ffe5d670,transparent 55%),radial-gradient(at 85% 20%,#d8eaff90,transparent 55%),radial-gradient(at 50% 85%,#e8dff090,transparent 55%),#f2f4f8}.topbar{display:flex;gap:8px;align-items:center;padding:13px 12px;border-bottom:1px solid #00000008;background:#ffffff80;flex-shrink:0}.brand{font-size:12px;font-weight:600;flex:1}.logo{font-weight:700;font-size:15px;color:#35526c}.pill{font-size:9px;color:#f5f8ff;background:#242930;padding:4px 8px;border-radius:20px;white-space:nowrap}.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#69c38d;margin-right:4px}.conversation-bar{display:flex;align-items:center;gap:6px;padding:8px 9px}.switcher{font-size:12px;text-align:left;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 6px;border-radius:6px;font-weight:550}.new{font-size:11px;padding:6px 7px;border-radius:6px;white-space:nowrap;color:#5a6775}.background-task{display:block;width:calc(100% - 26px);margin:0 13px 6px;padding:7px 0;text-align:left;font-size:10px;color:#687b8d;border-bottom:1px solid #66778812}.messages{padding:16px 14px;flex:1;min-height:0;overflow:auto}.bubble{background:#ffffffb5;border:1px solid #ffffffc9;padding:11px 12px;border-radius:12px 12px 3px 12px;font-size:12px;line-height:1.7;margin:0 0 20px 18px;white-space:pre-wrap}.answer{font-size:12px;line-height:1.9;color:#495563;margin:0 0 18px}.step{font-size:10px;line-height:1.8;color:#6d7c8c;padding:4px 0}.step strong{font-weight:500;color:#3d6e56}.empty{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 10px 20px}.empty h3{font-weight:500;font-size:19px;margin:0 0 8px}.empty p{font-size:11px;color:#818996;margin:0}.suggestion{font-size:11px;color:#53687e;border:1px solid #dce3eb;border-radius:8px;padding:9px 12px;margin-top:20px;text-align:left;align-self:flex-start}.dock{margin:10px 11px 12px;border:1px solid #ffffffdd;background:#ffffffb3;border-radius:17px;box-shadow:0 5px 20px #3344550a;padding:10px;flex-shrink:0}.page-pill{font-size:9px;color:#708092;background:#edf1f6;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 7px;border-radius:6px;margin-bottom:5px}.dock textarea{border:0;background:none;resize:none;outline:none;width:100%;padding:8px 0;height:51px;font-size:12px;color:#465567}.dock textarea::placeholder{color:#98a0ad}.dock-row{display:flex;align-items:center;gap:8px;font-size:10px;color:#7c8793}.dock-row .model{flex:1}.send{border-radius:50%;width:27px;height:27px;background:#253241;color:white;font-size:17px;padding:0}.send:hover:not(:disabled){background:#3b5169}.hold{font-size:10px;padding:5px 7px;background:#edf0f5;border-radius:5px;color:#576879}.menu{position:absolute;top:98px;left:9px;right:9px;padding:6px;border:1px solid #dce2e8;background:#fffffff5;backdrop-filter:blur(20px);border-radius:10px;box-shadow:0 8px 24px #20304020;z-index:5}.menu-title{padding:6px 8px;color:#9299a3;font-size:10px}.menu button{width:100%;display:flex;text-align:left;align-items:center;gap:8px;padding:11px 8px;border-radius:6px;font-size:12px}.menu button small{margin-left:auto;color:#8290a0;font-size:10px}.menu button[aria-current=true]{background:#edf3f9}.notice{font-size:10px;color:#798591;line-height:1.7;padding:10px 14px;border-top:1px solid #00000007}.person{display:flex;align-items:center;gap:7px;padding:8px 0;font-size:11px;border-bottom:1px solid #70809012}.person i{width:6px;height:6px;border-radius:50%;background:#c95454}.person.green i{background:#32825d}.person small{margin-left:auto;font-size:10px;color:#7c8897}.start{background:#26394c;color:white;padding:9px 13px;border-radius:7px;font-size:11px;margin-top:14px}.start:hover:not(:disabled){background:#415d78}.comparison-caption{color:#7d838b;font-size:12px;line-height:1.75;margin:13px 0}.status-line{font-size:11px;color:#768294;min-height:20px;margin:0 0 10px}.task-list{padding-left:17px;color:#5e6a79;font-size:12px;line-height:2.3}.review-note{display:flex;justify-content:space-between;gap:20px;color:#8c9299;font-size:11px;margin-top:26px;border-top:1px solid #e0e2df;padding-top:17px;line-height:1.8}.review-note a{color:inherit}.badge{border-radius:4px;color:#48775d;background:#e8f1eb;font-size:10px;padding:3px 6px}.mono{font-variant-numeric:tabular-nums}@media(min-width:1480px){.workspace{grid-template-columns:minmax(180px,1fr) 340px}.window{height:690px}}@media(max-width:1100px){.workspace{grid-template-columns:minmax(140px,1fr) 260px}.page{padding:22px 12px}.comparison{gap:16px}main{padding:25px 18px}}@media(max-width:880px){.comparison{grid-template-columns:1fr}.workspace{grid-template-columns:1fr 310px}.window{height:620px}main{max-width:740px}.review-note{display:block}}@media(max-width:480px){.workspace{grid-template-columns:125px minmax(0,1fr)}.page{padding:18px 9px}.page h2{font-size:18px}.value{font-size:10px;padding:8px}.brand{font-size:10px}.pill{font-size:8px}.topbar{gap:5px;padding:12px 8px}.new{font-size:10px;padding:6px 3px}.switcher{font-size:11px}.window{height:660px}main{padding:22px 12px}.label{gap:8px}.label span{font-size:10px}h1{font-size:23px}nav button{padding:8px 9px}.pointer{font-size:8px}.dock-row{gap:4px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body><main>
<header><div class="eyebrow">BY YOUR SIDE · 交互原型 · 模拟数据</div><h1>换一件事，原来的事继续。</h1><p>先体验改后的流程，再决定是否落地。</p></header>
<nav aria-label="对照场景"><button id="scene-conversations" aria-selected="true">新建与切换会话</button><button id="scene-shared" aria-selected="false">同页分工</button><span class="spacer"></span><button id="reset" class="reset">↻ 重放</button></nav>
<p id="hint">从右侧「＋ 新会话」开始，再点会话标题切回「完善简历」。</p>
<div class="comparison"><section><div class="label"><b>改之前</b><span>按当前代码重绘</span></div><div class="window" id="before"></div><p class="comparison-caption" id="before-caption"></p></section><section><div class="label"><b>改之后</b><span>待你确认的使用方式</span></div><div class="window" id="after"></div><p class="comparison-caption" id="after-caption"></p></section></div>
<footer class="review-note"><span>交互原型 · 页面内容、Agent 与进度均为模拟，不连接模型，不操作真实网页。</span><span>判断重点：会话切换是否清楚；后台状态是否可见；同页分工与接管是否符合预期。<br><a href="https://app.notion.com/p/20f886bc60ff81b980f7f60210dfebea" target="_blank" rel="noreferrer">依据：Will’s S · 指引与反馈</a></span></footer>
</main>
<script>
const $=s=>document.querySelector(s);
let scene='conversations',active='a',menu=false,clock=0,sharedStep=0,sharedRunning=false,sharedHeld=false,sharedElapsed=0,nextId=2;
let chats={a:{title:'完善简历',draft:'',messages:[],elapsed:0,running:true,held:false,done:false},b:null};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pointer=(name,green=false)=>`<div class="pointer ${green?'green':''}"><svg viewBox="0 0 20 26" aria-hidden="true"><path d="M2 2L17 15L10 16L7 23Z"/></svg><span><em>${name}</em></span></div>`;
function chrome(after,shared){return `<div class="chrome"><div class="dots"><i></i><i></i><i></i></div>${after?`<span class="group">完善简历</span><span class="chrome-tab">个人简历</span>${!shared&&Object.values(chats).some(c=>c?.messages.length)?'<span class="group blue">出行清单</span>':''}`:`<span class="chrome-tab">个人简历${shared?'　 简历副本':''}</span>`}</div>`}
function page(after,shared){
 if(after&&!shared&&active!=='a'&&chats[active].messages.length){return `<div class="page"><div class="site">TRAVEL NOTES</div><h2>出行清单</h2><p class="subtitle">为下次出发做准备</p><div class="status-line">${chats[active].done?'已整理':chats[active].running?'正在整理清单…':'新的一页'}</div>${chats[active].messages.length?'<ul class="task-list"><li>证件与行程单</li><li>交通与住宿</li><li>随身物品</li></ul>':''}<p class="page-foot">简历保留在它自己的标签组里。</p></div>`}
 const top=after?(shared?sharedStep>=2:chats.a.elapsed>=9):false,bottom=after?(shared?sharedStep>=4:chats.a.done):false;
 return `<div class="page"><div class="site">MY PROFILE</div><h2>个人简历</h2><p class="subtitle">这份草稿尚未提交</p><div class="field"><label>工作经历</label><div class="value ${top?'filled':''} ${after&&shared&&sharedStep===1?'red':''}">${top?'产品经理 · 2023—至今\n负责用户研究与产品规划，推动需求验证和上线。':'补充工作经历…'}</div>${after&&shared&&sharedStep>0?pointer('林 · 工作经历'):''}</div><div class="field"><label>教育经历</label><div class="value ${bottom?'filled':''} ${after&&shared&&sharedStep===3?'green':''}">${bottom?'信息管理 · 本科\n2019—2023\n课程：数据分析、交互设计。':'补充教育经历…'}</div>${after&&shared&&sharedStep>0?pointer('禾 · 教育经历',true):''}</div><p class="page-foot">${after&&shared?'两位 Agent 使用同一份草稿。':bottom?'两部分已填写，等待你检查。':'内容仅保留在当前页面。'}</p></div>`
}
function topbar(state){return `<div class="topbar"><span class="logo">↗</span><span class="brand">By Your Side</span><span class="pill"><i class="dot"></i>${state}</span></div>`}
function dock(after,shared){const c=after?chats[active]:chats.a;const held=shared?sharedHeld:c.held;return `<div class="dock"><span class="page-pill">▤ ${!shared&&after&&active!=='a'?(c.messages.length?'出行清单':'个人简历 · 另一会话正在使用'):'个人简历'}</span><textarea aria-label="${after?'改后':'改前'}消息输入" ${!after||shared?'disabled':''} placeholder="${held?'现在归你，交还后继续':c.running?'插话：调整 Agent 的方向…':'给 By Your Side 发消息'}">${after&&!shared?esc(c.draft):''}</textarea><div class="dock-row"><span>＋</span><span class="model">MiniMax M3⌄</span>${after&&(shared?sharedRunning||sharedHeld:c.running||c.held)?`<button class="hold" data-action="hold">${held?'交还':'接管'}</button>`:''}${after&&!shared&&c.running?'<button class="hold" data-action="stop" title="中止当前会话任务">中止</button>':''}<button class="send" ${!after||shared?'disabled':''} data-action="send" aria-label="发送">↑</button></div></div>`}
function thread(c,id){if(id==='a')return `<div class="bubble">帮我完善这份简历，先填内容，暂不提交。</div><p class="answer">我会补充工作经历和教育经历，完成后留给你检查。</p><div class="step"><strong>✓</strong> 已读取简历与材料</div><div class="step">${c.elapsed>=9?'✓ 工作经历已填写':'◌ 正在填写工作经历'}</div><div class="step">${c.done?'✓ 教育经历已填写':c.elapsed>=9?'◌ 正在填写教育经历':'· 接下来填写教育经历'}</div><p class="answer" style="margin-top:18px">${c.done?'两部分都已填好，尚未提交。':c.held?'现在归你。交还后从这里继续。':!c.running?'任务已中止，已填内容保留。':''}</p>`;
 if(!c.messages.length)return `<div class="empty"><h3>从这里开始。</h3><p>可以聊另一件事。</p><button class="suggestion" data-action="suggest">帮我整理出行清单 ↗</button></div>`;
 return c.messages.map(m=>`<div class="bubble">${esc(m)}</div>`).join('')+`<p class="answer">${c.done?'清单已整理好：证件、交通住宿和随身物品。':c.held?'现在归你。':c.running?'我正在整理出行清单。':'任务已中止。'}</p>`;
}
function renderConversations(){
 const c=chats[active];
 $('#before').innerHTML=chrome(false,false)+`<div class="workspace">${page(false,false)}<div class="panel">${topbar('运行中')}<div class="messages"><div class="bubble">帮我完善这份简历，先填内容，暂不提交。</div><p class="answer">我会补充工作经历和教育经历，完成后留给你检查。</p><div class="step">✓ 已读取简历与材料</div><div class="step">◌ 正在填写工作经历</div></div>${dock(false,false)}</div></div>`;
 const other=Object.entries(chats).filter(([id,v])=>v&&id!==active&&(v.running||v.held||v.done));
 const bg=other.length?`<button class="background-task" data-action="other" data-id="${other[0][0]}">${other[0][1].running?'◌':other[0][1].held?'Ⅱ':'✓'} ${esc(other[0][1].title)} · ${other[0][1].running?'后台运行中':other[0][1].held?'已接管':'已完成'}　↗</button>`:'';
 $('#after').innerHTML=chrome(true,false)+`<div class="workspace">${page(true,false)}<div class="panel">${topbar(c.held?'归你':c.running?'运行中':'已连接')}<div class="conversation-bar"><button class="switcher" data-action="menu" aria-expanded="${menu}">${esc(c.title)}　⌄</button><button class="new" data-action="new">＋ 新会话</button></div>${bg}<div class="menu" ${menu?'':'hidden'}><div class="menu-title">最近会话</div>${Object.entries(chats).filter(([,v])=>v).map(([id,v])=>`<button data-action="switch" data-id="${id}" aria-current="${id===active}"><span>${esc(v.title)}</span><small>${v.held?'归你':v.running?'运行中':v.done?'已完成':'未开始'}</small></button>`).join('')}</div><div class="messages">${thread(c,active)}</div>${dock(true,false)}</div></div>`;
 $('#before-caption').textContent='只有当前对话，没有新建和切换会话入口。';
 $('#after-caption').textContent='会话标题用于切换；新建另一段对话后，旧任务继续，状态仍可见。';
}
function sharedStatus(){return sharedHeld?['已接管','已接管']:sharedStep===0?['待开始','待开始']:sharedStep===1?['正在填写','准备内容']:sharedStep===2?['已填好','等待输入']:sharedStep===3?['已填好','正在填写']:['已填好','已填好']}
function renderShared(){
 const status=sharedStatus();
 $('#before').innerHTML=chrome(false,true)+`<div class="workspace">${page(false,true)}<div class="panel">${topbar('运行中')}<div class="messages"><div class="bubble">帮我完善这份简历，先填内容，暂不提交。</div><p class="answer">当前 worker 默认各自打开一个标签页。</p><div class="person"><i></i>林 · 工作经历<small>标签页 1</small></div><div class="person green"><i></i>禾 · 教育经历<small>标签页 2</small></div><p class="answer" style="margin-top:22px;color:#86909b">未保存的内容分在两份页面里。</p></div>${dock(false,true)}</div></div>`;
 $('#after').innerHTML=chrome(true,true)+`<div class="workspace">${page(true,true)}<div class="panel">${topbar(sharedHeld?'归你':sharedRunning?'协作中':'已连接')}<div class="conversation-bar"><span class="switcher">完善简历</span><span class="badge">同一页</span></div><div class="messages"><div class="bubble">帮我完善这份简历，先填内容，暂不提交。</div><p class="answer">这两部分可以同时准备。我会让林整理工作经历，禾整理教育经历，再写入当前这份草稿，暂不提交。</p><div class="person"><i></i>林 · 工作经历<small>${status[0]}</small></div><div class="person green"><i></i>禾 · 教育经历<small>${status[1]}</small></div>${sharedStep===0?'<button class="start" data-action="start-shared">播放自动分工过程</button>':''}<p class="answer" style="margin-top:18px">${sharedHeld?'两位都已停手。你可以先改，交还后继续。':sharedStep>=4?'两部分都已填好，尚未提交。你可以检查这份完整草稿。':sharedStep===2?'工作经历已核对，接下来填写教育经历。':''}</p></div>${dock(true,true)}</div></div>`;
 $('#before-caption').textContent='已有多 Agent 和不同颜色光标，但默认分标签执行，同页协作尚未打通。';
 $('#after-caption').textContent='Agent 主动判断并说明分工；各自准备内容，轮流写入。用户不必指定人数。';
}
function render(){scene==='conversations'?renderConversations():renderShared();}
function reset(){active='a';menu=false;clock=0;sharedStep=0;sharedRunning=false;sharedHeld=false;sharedElapsed=0;nextId=2;chats={a:{title:'完善简历',draft:'',messages:[],elapsed:0,running:true,held:false,done:false},b:null};render()}
function switchScene(s){scene=s;$('#scene-conversations').setAttribute('aria-selected',s==='conversations');$('#scene-shared').setAttribute('aria-selected',s==='shared');$('#hint').textContent=s==='conversations'?'从右侧「＋ 新会话」开始，再点会话标题切回「完善简历」。':'用户只提目标，由 Agent 判断分工。右侧播放过程中可以「接管」和「交还」。';reset()}
$('#scene-conversations').onclick=()=>switchScene('conversations');$('#scene-shared').onclick=()=>switchScene('shared');$('#reset').onclick=reset;
$('#after').addEventListener('input',e=>{if(e.target.matches('textarea'))chats[active].draft=e.target.value});
$('#after').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,c=chats[active];
 if(action==='menu')menu=!menu;
 if(action==='new'){const id=chats.b?'c'+nextId++:'b';chats[id]={title:'新会话',draft:'',messages:[],elapsed:0,running:false,held:false,done:false};active=id;menu=false;}
 if(action==='switch'||action==='other'){active=b.dataset.id;menu=false;}
 if(action==='send'||action==='suggest'){const text=action==='suggest'?'帮我整理出行清单':c.draft.trim();if(text){c.messages.push(text);c.draft='';if(active!=='a')c.title='出行清单';c.running=true;c.done=false;c.elapsed=0;}}
 if(action==='stop'){c.running=false;c.held=false;}
 if(action==='hold'){if(scene==='shared'){sharedHeld=!sharedHeld;sharedRunning=!sharedHeld;}else{c.held=!c.held;c.running=!c.held;}}
 if(action==='start-shared'){sharedRunning=true;sharedStep=1;sharedElapsed=0;}
 render();if(action==='new')$('#after textarea')?.focus();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){menu=false;render()}if(e.key==='Enter'&&!e.shiftKey&&e.target.matches('#after textarea')){e.preventDefault();$('#after [data-action=send]').click()}});
setInterval(()=>{clock++;let changed=false;if(scene==='conversations'&&chats.b){for(const [id,c]of Object.entries(chats)){if(!c||!c.running)continue;c.elapsed++;if(c.elapsed===(id==='a'?24:10)){c.running=false;c.done=true;changed=true;}if(c.elapsed===9)changed=true;}}else if(sharedRunning){sharedElapsed++;if(sharedElapsed===4){sharedStep=2;changed=true}if(sharedElapsed===7){sharedStep=3;changed=true}if(sharedElapsed===12){sharedStep=4;sharedRunning=false;changed=true}}if(changed){const input=$('#after textarea'),focused=document.activeElement===input,pos=input?.selectionStart;render();if(focused){const next=$('#after textarea');next?.focus();next?.setSelectionRange(pos,pos)}}},1000);
reset();
</script>
