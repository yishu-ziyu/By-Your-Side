<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粒子球 · 输入区动态预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#222;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:920px;margin:40px auto;padding:0 24px}h1{font-size:24px;margin:0 0 6px;font-weight:600}p{color:#777;margin:0 0 24px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:30px}.label{margin-bottom:10px;color:#666}.label strong{color:#222;font-weight:600}.panel{height:620px;border:1px solid #dedede;border-radius:16px;overflow:hidden;background:radial-gradient(at 15% 15%,#ffdfce70,transparent 55%),radial-gradient(at 85% 20%,#c8e2ff80,transparent 55%),#f2f4f8;display:flex;flex-direction:column}.top{display:flex;align-items:center;padding:16px;border-bottom:1px solid #ddd7;gap:8px;font-size:13px;font-weight:600}.logo{width:22px;height:22px}.connected{margin-left:auto;color:#777;font-size:11px;font-weight:400}.dot{display:inline-block;width:6px;height:6px;background:#34c759;border-radius:50%;margin-right:5px}.bar{padding:10px 16px;display:flex;gap:12px;font-size:12px;color:#555}.bar span:first-child{margin-right:auto}.messages{flex:1;padding:20px 16px;overflow:auto}.user{max-width:85%;margin-left:auto;background:#fff9;padding:12px 14px;border-radius:14px;font-size:13px}.steps{font-size:12px;color:#727780;margin-top:24px}.step{padding:12px 0;border-bottom:1px solid #ccc4}.answer{font-size:13px;margin-top:14px}.composer{margin:12px;padding:12px;background:#fffa;backdrop-filter:blur(20px);border:1px solid #fff;border-radius:20px;box-shadow:0 4px 18px #00000007}.page{font-size:10px;color:#888;padding-bottom:10px}.placeholder{color:#aaa;font-size:13px;min-height:33px}.controls{display:flex;align-items:center;gap:10px}.controls .spacer{flex:1}button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #0071e3;outline-offset:3px}.muted{color:#888;font-size:12px}.send{width:28px;height:28px;background:#222;color:white;border-radius:50%}.voice-button{display:inline-flex;align-items:center;gap:5px;border:1px solid #dce2e8;border-radius:16px;padding:5px 9px;font-size:11px;background:#fff8;color:#374151}.voice-button.on{background:#e9f3ff;color:#0071e3;border-color:#b8d6f8}.voice{padding:9px 2px 12px;display:flex;gap:8px;font-size:12px;color:#4b5563;border-bottom:1px solid #ddd7;margin-bottom:10px}.voice[hidden]{display:none}.voice .status{flex:1}.voice button{color:#707782}.receipt{font-size:10px;color:#91969e;margin-top:6px}.scenes{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.scenes button{border:1px solid #ddd;border-radius:7px;padding:6px 10px;background:white;font-size:12px}.caption{font-size:12px;color:#8a8a85;margin-top:18px}@media(max-width:650px){.compare{grid-template-columns:1fr}.panel{height:540px}main{margin-top:24px}}.voice{align-items:center;position:relative;min-height:174px;justify-content:center;border-bottom:1px solid #e3dfed;padding:0 0 30px}.voice #orb-large{width:160px;height:160px;flex-shrink:0}.voice-meta{position:absolute;bottom:8px;text-align:center;display:flex;flex-direction:column;font-size:12px}.voice-hint{font-size:10px;color:#98929e;margin-top:2px}.voice .end{position:absolute;right:0;top:8px;font-size:11px}.voice-button{padding:0 7px 0 0;border-color:#e5dff0;gap:0;color:#655784}.voice-button.on{background:#f2eef9;border-color:#ddd2ed;color:#655784}.voice-button canvas{width:36px;height:36px}.voice:not([hidden]){animation:reveal 200ms cubic-bezier(.23,1,.32,1)}.scenes button[aria-pressed="true"]{background:#eee8f7;border-color:#c9b9df;color:#675086}.caption a{color:inherit}.panel{height:670px}@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.voice:not([hidden]){animation:none}}@media(max-width:650px){.panel{height:620px}}</style>
<main><h1>粒子球，留在输入区</h1><p>点击右侧粒子球展开，再切换下方状态。模拟听说，不采集麦克风、不播放声音。</p><div class="compare"><section><div class="label">改之前</div><div class="panel" id="before"></div></section><section><div class="label"><strong>改之后</strong> · 已选 Particles Orb</div><div class="panel" id="after"></div></section></div><div class="scenes"><button data-scene="idle">未开语音</button><button data-scene="connecting">连接中</button><button data-scene="listening">聆听</button><button data-scene="thinking">思考</button><button data-scene="answer">问进度</button><button data-scene="interrupt">插话停声</button><button data-scene="error">连接失败</button></div><div class="caption">粒子绘制改编自 <a href="https://github.com/amunozdev/voiceorbs">VoiceOrbs</a>（MIT）。开启后只查询当前会话的进度；结束语音不影响任务。切换会话或关闭侧栏结束语音。</div></main>
<script type="module">
import {mountOrb} from "./voice-orb-assets/particles.js";
let currentScene="idle";
const mic='<svg width="13" height="15" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="1" width="6" height="10" rx="3"/><path d="M2 7v1a6 6 0 0 0 12 0V7M8 14v3M5 17h6"/></svg>';
function panel(after){return `<div class="top"><span>◈</span> By Your Side <span class="connected"><i class="dot"></i>执行中</span></div><div class="bar"><span>挑选一张书桌 ▾</span><span>记忆</span><span>＋ 新会话</span></div><div class="messages"><div class="user">帮我找一张一千元以内的书桌。</div><div class="steps">⌄ 查看执行过程<div class="step">✓ 已打开商品列表</div><div class="step">◌ 正在读取候选商品</div></div><div class="query"></div><div class="answer"></div><div class="receipt"></div></div><div class="composer"><div class="page">当前页面 · 书桌搜索结果</div>${after?'<div class="voice" hidden><canvas id="orb-large" width="160" height="160" aria-label="紫色粒子球"></canvas><div class="voice-meta"><span class="status" role="status">正在听你说</span><span class="voice-hint">随时插话 · 仅查询进度</span></div><button class="end">结束</button></div>':''}<div class="placeholder">插话：调整 Agent 的方向…</div><div class="controls"><button class="muted">＋</button><span class="muted">MiniMax M3</span><span class="spacer"></span>${after?`<button class="voice-button" aria-label="打开语音问进度"><canvas id="orb-small" width="36" height="36" aria-hidden="true"></canvas><span>语音问进度</span></button>`:''}<button class="muted">接管</button><button class="send">■</button></div></div>`}
document.querySelector('#before').innerHTML=panel(false);document.querySelector('#after').innerHTML=panel(true);
function scene(name){currentScene=name;document.querySelectorAll("[data-scene]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.scene===name)));const el=document.querySelector('#after'),voice=el.querySelector('.voice'),button=el.querySelector('.voice-button');voice.hidden=name==='idle';button.classList.toggle('on',name!=='idle');el.querySelector('.query').innerHTML='';el.querySelector('.answer').textContent='';el.querySelector('.receipt').textContent='';document.querySelector('#before .query').innerHTML='';voice.querySelector('.status').textContent=({connecting:'正在连接',thinking:'正在查看任务进度',listening:'正在听你说',answer:'正在回答',interrupt:'已停声，继续听你说',error:'语音连接失败'}[name]||'正在听你说');voice.querySelector('.end').textContent=name==='error'?'重试':'结束';if(name==='answer'||name==='interrupt'){el.querySelector('.query').innerHTML='<div class="user" style="margin-top:26px">现在做到哪了？</div>';el.querySelector('.answer').textContent='正在读取候选商品，还没有完成筛选。';el.querySelector('.receipt').textContent='依据当前任务状态 · 刚刚更新';document.querySelector('#before .query').innerHTML='<div style="color:#999;font-size:12px;margin-top:26px">在输入框中打字询问进度</div>';}el.querySelector('.messages').scrollTop=el.querySelector('.messages').scrollHeight;}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>scene(b.dataset.scene));document.querySelector('.voice-button').onclick=()=>scene(document.querySelector('.voice').hidden?'listening':'idle');document.querySelector('.end').onclick=()=>scene(document.querySelector('.end').textContent==='重试'?'listening':'idle');scene('idle');
const orbState=()=>({answer:'speaking',interrupt:'listening'}[currentScene]||currentScene);
mountOrb(document.querySelector('#orb-small'),160,()=> 'idle');
mountOrb(document.querySelector('#orb-large'),160,orbState);
</script></html>
