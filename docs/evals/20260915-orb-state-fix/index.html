<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光球状态动效</title><style>
:root{--orb-ink:#374151;--text-secondary:#667085;--e-spring:cubic-bezier(.34,1.4,.64,1);--e-swift:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#29312b;font:16px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:850px;margin:auto;padding:32px}h1{font-size:28px;margin:0}p{color:#6a7469}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}button{font:inherit;padding:8px 16px;background:#fff;border:1px solid #cbd2c8;border-radius:9px;cursor:pointer}button[aria-pressed=true]{background:#304b3b;color:#fff}.stage{background:white;border:1px solid #e4e7e0;border-radius:16px;padding:24px}.line{display:flex;align-items:center;gap:12px;font-weight:600}.zoom{display:flex;align-items:center;gap:24px;padding:30px 0 12px;border-top:1px solid #eceee8;margin-top:24px}.hint{font-size:13px;color:#747e71}.evidence{margin-top:24px;font-size:14px}table{border-collapse:collapse;width:100%;background:#fff}td,th{text-align:left;padding:10px;border-bottom:1px solid #e4e7e0}canvas{animation:none!important}button:focus-visible{outline:2px solid #2f6fed;outline-offset:3px}
.orb-with-mark{display:inline-flex;align-items:center;gap:5px;flex-shrink:0}.status-mark{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:var(--status-ink);background:var(--status-bg)}.status-mark svg{width:13px;height:13px;stroke-width:2}.status-mark[hidden]{display:none}.zoom .status-mark{width:32px;height:32px;margin-left:8px}.zoom .status-mark svg{width:22px;height:22px}.comparison{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.comparison article{border:1px solid #e4e7e0;border-radius:12px;background:white;padding:16px}.comparison .sample{display:flex;align-items:center;gap:5px;margin:14px 0}.comparison p{font-size:13px;line-height:1.6;margin:8px 0 0}.preview-tag{display:inline-block;font-size:12px;color:#687466;border:1px solid #cdd6c8;padding:2px 8px;border-radius:6px;margin-bottom:12px}@media(max-width:650px){main{padding:20px}.comparison{grid-template-columns:repeat(2,1fr)}}
</style><main><span class="preview-tag">已应用到本地扩展</span><h1>给四种状态一个明确标记</h1><p>光球保留原版形态，旁边的小标记说明：轮到你、已完成、失败，还是已停止。下方按钮用于演示，真实产品由任务状态驱动。</p><div class="controls" id="controls"></div><section class="stage"><div class="line"><span id="actual" class="orb-with-mark"></span><span id="label"></span></div><div class="zoom"><span id="large" class="orb-with-mark"></span><div><div id="description"></div><div class="hint">上方为侧栏实际尺寸，下方放大观察。</div></div></div></section><section class="comparison" id="comparison" aria-label="四种状态并排比较"></section><p class="hint">失败原因的位置在文字里；下面用“页面读取失败”举例，不表示当前任务出错。</p></main><script type="module">
import{createOrb}from'./orb.js';
import{createElement,Hand,Check,CircleAlert,Square}from'./status-icons.js';
const states=[['thinking','思考','正在思考','原版 solving：条带重排'],['executing','执行','正在执行','原版 working：粒子环绕'],['waiting','等待','正在等待结果','原版 breathing：圆环变形'],['user','等你操作','等待你操作','手形：现在轮到你'],['completed','完成','已完成','勾号：这项任务已经完成'],['failed','失败','页面读取失败','感叹号：没有完成，需要处理'],['stopped','已停止','已停止','方块：任务已经停止']];
const small=createOrb('thinking',20),large=createOrb('thinking',72);document.querySelector('#actual').append(small.el);document.querySelector('#large').append(large.el);

const marks={user:[Hand,'#496d87','#edf3f7'],completed:[Check,'#397453','#edf5ee'],failed:[CircleAlert,'#a55146','#fbefec'],stopped:[Square,'#68717d','#eff1f4']};
function markFor(state){const el=document.createElement('span');el.className='status-mark';el.setAttribute('aria-hidden','true');const m=marks[state];el.hidden=!m;if(m){el.style.setProperty('--status-ink',m[1]);el.style.setProperty('--status-bg',m[2]);el.append(createElement(m[0]));}return el;}
const miniMark=markFor('thinking'),bigMark=markFor('thinking');document.querySelector('#actual').append(miniMark);document.querySelector('#large').append(bigMark);
const controls=document.querySelector('#controls');states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[1];b.onclick=()=>select(i);controls.append(b)});
function select(i){const s=states[i];document.querySelector('#label').textContent=s[2];document.querySelector('#description').textContent=s[3];for(const orb of[small,large]){orb.setState(s[0]);orb.setRunning(i<3)}for(const mark of[miniMark,bigMark]){const next=markFor(s[0]);mark.hidden=next.hidden;mark.style.cssText=next.style.cssText;mark.replaceChildren(...next.childNodes)}[...controls.children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j?'true':'false'))}
for(const s of states.slice(3)){const card=document.createElement('article'),title=document.createElement('strong'),row=document.createElement('div'),desc=document.createElement('p');title.textContent=s[1];row.className='sample';const orb=createOrb('thinking',20);orb.setState(s[0]);orb.setRunning(false);row.append(orb.el,markFor(s[0]));desc.textContent=s[3];card.append(title,row,desc);document.querySelector('#comparison').append(card)}
select(4);
</script></html>
