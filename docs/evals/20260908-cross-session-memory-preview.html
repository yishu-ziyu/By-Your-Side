<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>By Your Side · 跨会话记忆</title><link rel="icon" href="data:,"><style>

-size:17px}.top strong{font-size:15px;letter-spacing:-.3px}.connected{margin-left:auto;font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}.dot{width:6px;height:6px;background:#34a853;border-radius:50%}.session{display:flex;align-items:center;gap:6px;padding:11px 16px;font-size:12px}.session strong{font-weight:600;margin-right:auto}.session button{font-size:12px}.messages{padding:12px 20px;overflow:auto;flex:1;min-height:0;scroll-behavior:smooth}.empty{padding-top:48px}.empty h3{font-size:22px;font-weight:500;margin:0 0 14px;letter-spacing:-.6px}.empty p{font-size:13px;line-height:1.8;color:#596778;margin:0}.bubble{background:var(--paper);border:1px solid #e5e8ee;border-radius:17px 17px 4px 17px;padding:13px 15px;margin:4px 0 18px 32px;font-size:13px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.reply{font-size:13px;line-height:1.85;margin:0 0 19px;white-space:pre-wrap;overflow-wrap:anywhere}.receipt{font-size:12px;color:#3f647f;display:flex;align-items:center;gap:7px;padding:6px 0;margin-top:-11px;margin-bottom:18px}.receipt button{padding:3px 2px;font-size:12px;color:var(--blue);text-align:left}.receipt .tag{color:#697b8c;font-size:10px}.failure{color:#9e493d;background:#fff6f2;border:1px solid #f1d5c9;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:15px}.failure button{color:var(--blue);font-size:12px}.dock{background:#ffffffd9;border:1px solid #ffffff;border-radius:22px;padding:11px 13px;margin:12px;box-shadow:0 5px 16px #4a587d08}.page{font-size:10px;color:#5e6b7d;margin-bottom:8px}.dock textarea{display:block;width:100%;height:67px;resize:none;outline:0;border:0;background:none;font-size:13px;line-height:1.65;padding:0 2px}.dockfoot{display:flex;justify-content:space-between;align-items:center}.dockfoot span{font-size:11px;color:var(--muted)}.send{border-radius:50%;width:32px;height:32px;background:#16202d;color:white;padding:0;font-size:20px}.send:hover{background:#384b62}.suggest{font-size:11px;color:var(--blue);padding:5px 0;text-align:left;line-height:1.5}.notice{font-size:11px;background:#ffffffbd;border-radius:8px;padding:8px 11px;margin:0 13px;line-height:1.5;color:#536273}.shade{position:absolute;inset:0;background:#1b2b422b;z-index:2}.manager{position:absolute;background:var(--paper);z-index:3;display:flex;flex-direction:column;inset:180px 0 0;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #27374716}.variant-b .manager{inset:55px 0 0;border-radius:0;box-shadow:none}.managerhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}.managerhead h3{margin:0;font-size:17px;font-weight:600}.managerhead button{font-size:12px;color:var(--muted)}.managerbody{overflow:auto;padding:0 20px 20px;flex:1;min-height:0}.quiet{font-size:11px;color:var(--muted);line-height:1.7}.row{border-bottom:1px solid var(--line);padding:15px 0}.row p{margin:0 0 8px;font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.rowmeta{display:flex;align-items:center;justify-content:space-between;gap:8px}.scope{font-size:10px;color:#596e85;background:var(--soft);border-radius:4px;padding:4px 6px}.rowmeta button{font-size:11px;color:var(--blue);padding:4px 6px}.source{font-size:11px;color:var(--muted);line-height:1.8;margin-top:11px;padding:10px;background:var(--soft);border-radius:7px}.edit textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--paper);resize:vertical;font-size:13px;line-height:1.7}.edit label{display:block;font-size:11px;color:var(--muted);margin:12px 0 6px}.edit select{width:100%;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.primary{background:var(--blue);color:white}.primary:hover{background:#005dae}.danger{color:#ba3d35}.delete{background:var(--soft);padding:15px;border-radius:10px;margin-top:10px}.delete h4{margin:0 0 8px;font-size:14px}.blank{padding:35px 5px;color:var(--muted);text-align:center}.blank h4{color:#374558;font-size:15px;font-weight:500}.foot{margin-top:20px;display:flex;gap:12px;align-items:center;font-size:11px;color:var(--muted);line-height:1.8;flex-wrap:wrap}.foot a{color:inherit}.walk{display:flex;gap:5px;font-size:11px;color:#596e85;padding:10px 1px 0;flex-wrap:wrap}.walk span{background:#ecf0f4;padding:5px 8px;border-radius:5px}.dark{--paper:#222b38;--soft:#2b3543;--line:#3a4657;--muted:#a2adbb;--blue:#81baff;--wall:radial-gradient(at 10% 0%,#3c303d,transparent 65%),radial-gradient(at 100% 10%,#243d52,transparent 65%),#202938;color:#e7edf5;background:#151c25}.dark .top,.dark .notice{background:#222b3899}.dark .panel{border-color:#405065}.dark .dock{background:#222b38e8;border-color:#3e4b5d}.dark .receipt,.dark .empty p,.dark .page,.dark .scope,.dark .notice{color:#b7c7d8}.dark .recommend,.dark .walk span{background:#273f58;color:#a9d1ff}.dark .primary{background:#3976af;color:white}.dark .bubble{border-color:#455366}.dark .failure{background:#3d2d29;color:#f3c2b1;border-color:#705149}.dark .tools select{color:inherit}.dark .blank h4{color:inherit}@media(max-width:750px){main{padding:24px 16px}.compare{grid-template-columns:1fr;gap:28px}h1{font-size:25px}.panel{height:635px}.tools{gap:6px}.tools .spacer{display:none}.manager{inset:150px 0 0}.top strong{font-size:14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><header><div class="eyebrow">BY YOUR SIDE / 交互原型</div><h1>换个会话，也记得你的做法。</h1><p>两种入口，同一条路径。先发送预填的「记住」，再点「新会话」。<br><small>模拟数据与回复 · 未连接模型 · 刷新重置</small></p></header><div class="tools"><label>当前页面 <select id="site"><option value="research.example">research.example · 资料库</option><option value="travel.example">travel.example · 出行清单</option></select></label><label><input id="fail" type="checkbox"> 下次保存失败</label><span class="spacer"></span><button id="theme">切换深色</button><button id="reset">重置演示</button></div><div class="compare"><section class="option"><h2>A · 留在会话里 <span class="recommend">推荐</span></h2><p class="caption">回执里查看详情，抽屉里管理，聊天仍在身后。</p><div id="a" class="panel"></div></section><section class="option"><h2>B · 独立管理</h2><p class="caption">顶部固定入口，打开完整的记忆列表。</p><div id="b" class="panel variant-b"></div></section></div><div class="walk"><span>① 发送「记住」</span><span>② 新会话 → 整理材料</span><span>③ 查看使用的记忆</span><span>④ 修改／忘记 → 再次新会话</span></div><footer class="foot"><strong>模拟演示</strong><span>回复与记忆均为本页模拟，刷新重置；未连接模型，未写入真实记忆。</span><a href="20260908-cross-session-memory.md">完成标准</a><a href="20260908-cross-session-memory-design.md">设计依据</a></footer></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial='以后在 research.example 整理会议摘要时，用三条要点。请记住，只用于这个网站。';
const taskText='整理会议摘要：北岸访谈发现旧记录难找；团队决定评估搜索改版；成本下周确认。';
function demoAnswer(m){if(!m.text.includes('会议摘要'))return null;if(m.text.includes('一段话'))return '北岸访谈发现用户难以找到旧记录，团队决定评估搜索改版，并于下周确认成本。';if(m.text.includes('三条要点'))return '• 北岸访谈发现旧记录难找。\n• 团队决定评估搜索改版。\n• 改版成本将在下周确认。';if(m.text.includes('两条要点'))return '• 北岸访谈发现旧记录难找，团队决定评估搜索改版。\n• 改版成本将在下周确认。';return null;}
let site='research.example', states={};
function fresh(){return {n:1,next:1,inspect:null,memory:null,chat:[],draft:initial,manager:false,editing:false,deleting:false,details:false,note:'',failed:null,history:[]};}
function reset(){states={a:fresh(),b:fresh()};$('#fail').checked=false;site='research.example';$('#site').value=site;renderAll();}
function row(s){const m=s.memory;if(!m)return '<div class="blank"><h4>还没有保存的记忆</h4><p class="quiet">在聊天里明确说「记住」，它才会出现在这里。</p></div>';
if(s.editing)return `<div class="edit"><label>记忆内容</label><textarea class="memory-text" aria-label="记忆内容">${esc(m.text)}</textarea><label>适用范围</label><select class="memory-scope" aria-label="适用范围"><option value="research.example" ${m.scope==='research.example'?'selected':''}>仅 research.example</option><option value="all" ${m.scope==='all'?'selected':''}>所有会话</option></select><p class="quiet">跨会话保留。只在相关任务中使用。</p><div class="actions"><button data-act="cancel">取消</button><button data-act="save-edit" class="primary">保存修改</button></div></div>`;
return `<div class="row"><p>${esc(m.text)}</p><div class="rowmeta"><span class="scope">${m.scope==='all'?'所有会话':'仅 '+esc(m.scope)}</span><div><button data-act="details">${s.details?'收起来源':'查看来源'}</button><button data-act="edit">修改</button><button data-act="delete" class="danger">忘记</button></div></div>${s.details?`<div class="source">来源：会话 ${m.sourceConversation||1} · 你明确要求记住<br>${esc(m.source||initial)}<br>${m.version>1?'已由你修改 · 版本 '+m.version:'刚刚保存'}</div>`:''}</div>${s.deleting?'<div class="delete"><h4>忘记这条记忆？</h4><p class="quiet">以后不再从记忆中使用它。旧聊天和已经生成的回复仍会保留。</p><div class="actions"><button data-act="cancel">取消</button><button data-act="confirm-delete" class="danger">确认忘记</button></div></div>':''}`;}
function chat(s,id){if(!s.chat.length)return `<div class="empty"><h3>${s.n===1?'你可以先教我一个习惯。':'新的会话，新的材料。'}</h3><p>${s.n===1?'把适用范围一起告诉我。':'当前会话没有旧聊天。相关的已保存记忆可以继续使用。'}</p></div>`;
return s.chat.map((x,index)=>x.role==='user'?`<div class="bubble">${esc(x.text)}</div>`:`<div class="reply">${esc(x.text)}</div>${x.receipt?`<div class="receipt"><span>✓</span><button data-act="manage" data-entry="${index}">${esc(x.receipt)}</button><span class="tag">${esc(x.scope||'')}</span></div>`:''}`).join('');}
function render(id){const s=states[id],root=$('#'+id);root.innerHTML=`<div class="top"><span class="brand">✧</span><strong>By Your Side</strong><span class="connected"><i class="dot"></i>演示</span>${id==='b'?'<button data-act="manage" title="管理记忆" aria-label="管理记忆">记忆</button>':''}</div><div class="session"><strong>会话 ${s.n} · ${s.n===1?'记住整理习惯':'整理新材料'}</strong>${id==='a'?'<button data-act="manage">记忆</button>':''}<button data-act="new">＋ 新会话</button><button data-act="reset-one" title="重置本方案" aria-label="重置本方案">↺</button></div><div class="messages">${chat(s,id)}${s.failed?'<div class="failure">未保存，记忆没有发生变化。<button data-act="retry">重试</button><button data-act="dismiss-failure">取消</button></div>':''}</div>${s.note?`<div class="notice" role="status">${esc(s.note)}</div>`:''}<div class="dock"><div class="page">▣ ${esc(site)} · ${site==='research.example'?'资料库':'出行清单'}</div><textarea aria-label="发送消息" placeholder="给 By Your Side 发消息">${esc(s.draft)}</textarea><div class="dockfoot"><span>模拟回复</span><button class="send" data-act="send" aria-label="发送">↑</button></div><button class="suggest" data-act="sample">${s.n===1?'填入「记住」示例':'填入整理材料示例'}</button></div>${s.manager?`${id==='a'?'<div class="shade" data-act="close"></div>':''}<section class="manager" role="dialog" aria-label="记忆管理"><div class="managerhead"><h3>记忆${s.memory?' · 1':''}</h3><button data-act="close">${id==='a'?'关闭':'← 返回会话'}</button></div><div class="managerbody"><p class="quiet">当前保存的记忆，你可以修改或忘记。</p>${s.inspect&&(!s.memory||s.memory.id!==s.inspect.id||s.memory.version!==s.inspect.version)?`<div class="source"><strong>这次回复使用的内容 · 版本 ${s.inspect.version}</strong><br>${esc(s.inspect.text)}<br>${s.inspect.scope==='all'?'所有会话':'仅 '+esc(s.inspect.scope)}${!s.memory||s.memory.id!==s.inspect.id?'<br>这条记忆现已忘记。这里保留的是旧回复的使用记录。':s.memory.version!==s.inspect.version?'<br>此后已更新，下方是当前版本。':''}</div>`:''}${row(s)}</div></section>`:''}`;const msgs=root.querySelector('.messages');msgs.scrollTop=msgs.scrollHeight;}
function renderAll(){render('a');render('b');}
function failSave(s,payload){if($('#fail').checked){$('#fail').checked=false;s.failed=payload;s.note='';return true;}return false;}
function remember(s,payload){s.memory=payload;s.failed=null;s.note='';s.chat.push({role:'assistant',text:'记住了。下次整理相关材料时会用上。',receipt:'已记住 · 查看',used:{...payload},scope:payload.scope==='all'?'所有会话':'仅 '+payload.scope});}
function send(id){const s=states[id],text=s.draft.trim();if(!text)return;s.chat.push({role:'user',text});s.draft='';s.note='';if(text.includes('记住')){const payload={id:s.next++,sourceConversation:s.n,text:text.replace(/^以后在 research\.example /,'').replace(/请记住.*$/,'').trim(),scope:text.includes('所有会话')?'all':'research.example',version:1,source:text};if(!failSave(s,payload))remember(s,payload);}else if(text===taskText){const m=s.memory,match=m&&(m.scope==='all'||m.scope===site),answer=match?demoAnswer(m):null;s.chat.push(answer?{role:'assistant',text:answer,receipt:'使用了 1 条记忆 · 查看',used:{...m},scope:m.scope==='all'?'所有会话':'仅 '+m.scope}:{role:'assistant',text:match?'已保存你的修改。原型目前只演示会议摘要的三条要点、两条要点或一段话；这条自定义内容的效果需在真实模型接入后验证。':'北岸访谈发现旧记录难找，团队决定评估搜索改版，成本将在下周确认。'});if(m&&!match)s.note='这条记忆仅适用于 research.example，本次未使用。';}else{s.chat.push({role:'assistant',text:'这是交互原型。请用下方示例体验记忆保存和跨会话使用；任意对话尚未接入模型。'});}render(id);}
for(const id of ['a','b']){$('#'+id).addEventListener('input',e=>{if(e.target.matches('.dock textarea'))states[id].draft=e.target.value;});$('#'+id).addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const s=states[id],act=el.dataset.act;if(act==='send'){send(id);return;}if(act==='reset-one'){states[id]=fresh();render(id);return;}if(act==='new'){s.history.push(s.chat);s.n++;s.chat=[];s.draft=taskText;s.manager=false;s.editing=false;s.deleting=false;s.failed=null;s.note='';}if(act==='sample')s.draft=s.n===1?initial:taskText;if(act==='manage'){s.manager=true;s.details=false;s.inspect=el.dataset.entry!==undefined?s.chat[Number(el.dataset.entry)]?.used||null:null;}if(act==='close'){s.manager=false;s.editing=false;s.deleting=false;}if(act==='details')s.details=!s.details;if(act==='edit')s.editing=true;if(act==='delete')s.deleting=true;if(act==='cancel'){s.editing=false;s.deleting=false;}if(act==='confirm-delete'){s.memory=null;s.failed=null;s.deleting=false;s.note='已忘记。旧聊天仍保留；新会话不会再从记忆中使用这条内容。';}if(act==='save-edit'){const text=$('#'+id+' .memory-text').value.trim();if(!text){$('#'+id+' .memory-text').focus();return;}const scope=$('#'+id+' .memory-scope').value;const payload={...s.memory,text,scope,version:s.memory.version+1};if(failSave(s,payload)){s.editing=false;s.manager=false;}else{s.memory=payload;s.editing=false;s.note='记忆已更新，下一次相关请求会使用新版。';}}if(act==='retry'){if(s.failed.version>1){s.memory=s.failed;s.failed=null;s.note='记忆已更新。';}else remember(s,s.failed);}if(act==='dismiss-failure')s.failed=null;render(id);if(act==='edit')$('#'+id+' .memory-text').focus();if(act==='new')$('#'+id+' .dock textarea').focus();});}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){for(const id of ['a','b']){if(states[id].manager){states[id].manager=false;states[id].editing=false;states[id].deleting=false;render(id);}}}if(e.key==='Enter'&&!e.shiftKey&&e.target.matches('.dock textarea')){e.preventDefault();send(e.target.closest('.panel').id);}});
$('#site').onchange=e=>{site=e.target.value;renderAll();};$('#reset').onclick=reset;$('#theme').onclick=()=>{document.body.classList.toggle('dark');$('#theme').textContent=document.body.classList.contains('dark')?'切换浅色':'切换深色';};reset();
</script></body></html>
