<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>助手分工：改前与改后</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#293029;font:16px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{max-width:1100px;padding:28px;margin:auto}h1{font-size:28px;margin:0 0 8px}p{margin:8px 0 18px}.sub{font-size:14px;color:#71776c}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{font:inherit;padding:9px 15px;border:1px solid #ccd1c7;background:white;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#2f4b3c;color:white}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.pair.single{grid-template-columns:minmax(0,450px)}figure{margin:0}figcaption{font-weight:600;margin-bottom:10px}img{width:100%;height:auto;border:1px solid #e0e2dc;border-radius:12px}.note{margin:24px 0;padding:18px;background:#e9eee5;border-radius:10px}.note p{margin:4px 0}.limits{font-size:13px;color:#6b7266;margin-top:22px}a{color:#365e43}@media(max-width:640px){main{padding:18px}.pair{gap:12px}h1{font-size:24px}figcaption{font-size:13px}} </style><main><h1>现在不展开日志，也能看懂助手分工</h1><p class="sub">同一类“双方案阅读 → 汇总”任务的真实截图。已加载到本地扩展。<br>侧栏生产页面在后台标签页截取；光标另由隔离无头浏览器运行真实工具核对。</p><nav id="nav"></nav><div id="pair" class="pair"></div><div class="note" id="note"></div><p class="limits">通过：真实双助手执行与交付、身份一致、历史回放、320px 窄面板、短任务无空助手区、失败/停止边界测试、普通单测及类型/构建/模块边界检查。<br>本次由你明确指定两位助手，尚未评价模型自主选择是否并行的可靠性；没有重新测试真人语音。短任务曾遇到一次请求失败，自动重试后成功，原记录保留。</p></main><script>
const views=[
{label:'摘要头像',images:[['改前 · 只有职责和名字','avatar-before.png'],['现在 · 小人头像与签名风格名字','art-names.png']],note:['使用同一套角色形象；右侧名字使用 Snell Roundhand 签名风格字体。','已重载本地扩展，真实双助手任务中确认头像可见；320px 面板无横向溢出。']},
{label:'1 默认过程',images:[['改前 · 等待中，只能看见 done','../20260915-cast-diagnosis/02-waiting.png'],['改后 · 分工、职责和等待直接可见','02-waiting.png']],note:['分工说明通过正式消息显示在执行区前。','执行摘要展示：负责什么、由谁执行、当前状态。来源未指定时如实写“等待助手结果”。工具日志仍然折叠。']},
{label:'2 身份对应',images:[['改前 · Mike / Lalo 变成两个 Gus','../20260915-cast-diagnosis/05-expanded.png'],['改后 · 创建回执与执行行同名','05-expanded-identities.png']],note:['角色在创建时分配，同一时间的助手不会撞名。','本次创建回执、摘要和执行行均为 Kim / Mike；具体来源明确时，等待写为“等待 Kim 的方案 A 摘要”。']},
{label:'3 完成与回看',images:[['完成后 · 两份摘要分别标明已交付','03-finished-summary.png'],['切走再回来 · 身份、职责和终态保留','08-history.png']],note:['助手交回结果后，摘要显示具体结果已交给主助手。','主助手仍统一给出最终比较；切会话回看，不换名字、不丢职责。']},
{label:'4 网页光标',images:[['Kim · 真实 hover 工具','cursor-kim.png'],['Mike · 真实 hover 工具','cursor-mike.png']],note:['在隔离无头浏览器里用同一批真实运行编号执行 hover。','光标名牌分别为 Kim / Mike，与侧栏一致。此处是定点工具验证，不冒充两方案只读任务中的鼠标运动。']},
{label:'5 窄面板与短任务',images:[['320px · 摘要没有横向溢出','06-narrow.png'],['简单问答 · 不出现空助手区','07-short.png']],note:['窄面板能读到职责和交付状态。','短任务保持原有单助手流程；本次请求自动重试一次后得到答案，没有出现空协作区。']}
];let nav=document.querySelector('#nav');views.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v.label;b.onclick=()=>show(i);nav.append(b)});function show(i){let v=views[i];document.querySelector('#pair').innerHTML=v.images.map(([title,url])=>'<figure><figcaption>'+title+'</figcaption><img src="'+url+'" alt="'+title+'"></figure>').join('');document.querySelector('#note').innerHTML=v.note.map(t=>'<p>'+t+'</p>').join('');[...nav.children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j?'true':'false'))}show(0);
</script></html>
