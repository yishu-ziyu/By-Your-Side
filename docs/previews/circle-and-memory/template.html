<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圈给它看 · 记忆露出来</title>
<style>
  :root {
    --desk: #e8e6e0;
    --ink: #141413; --ink-2: #5f5e58; --ink-3: #77756d;
    --line: rgba(20,20,19,.10);
    --ai: #2d4a86;
    --you: #d2602a;
    --mem-tint: rgba(45,74,134,.075);
    --mem-line: rgba(45,74,134,.38);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--desk); color: var(--ink); font: 13px/1.5 var(--font); display: flex; flex-direction: column; padding: 12px 14px 14px; gap: 10px; }

  /* 预览控制条：不属于产品，压低存在感 */
  .ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; background: rgba(20,20,19,.06); border-radius: 999px; padding: 2px; }
  .seg button, .ctl > button { font: 500 12.5px var(--font); border: 0; background: transparent; color: var(--ink-2); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(20,20,19,.10); }
  .ctl > button { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .ctl > button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .ctl > button:disabled { opacity: .45; cursor: default; }
  .narr { flex: 1 1 260px; min-width: 0; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .narr b { color: var(--ink); font-weight: 600; }

  /* 浏览器窗口 */
  .win { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px rgba(20,20,19,.10), 0 10px 30px rgba(20,20,19,.10); position: relative; }
  .tabbar { height: 38px; flex: none; background: #f1f0ec; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid rgba(20,20,19,.07); }
  .lights { display: flex; gap: 6px; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; background: #d9d7d0; }
  .url { flex: 1; max-width: 520px; height: 26px; border-radius: 999px; background: #fff; border: 1px solid rgba(20,20,19,.08); display: flex; align-items: center; padding: 0 12px; font-size: 12px; color: var(--ink-2); gap: 6px; }
  .url svg { flex: none; }
  .body { flex: 1 1 auto; min-height: 0; display: flex; }
  .vp { flex: 1 1 auto; min-width: 0; position: relative; overflow: hidden; background: #fff; }
  .pg { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .pg > img.shot { display: block; width: 1100px; user-select: none; -webkit-user-drag: none; }
  .pg .layer { position: absolute; inset: 0; }
  .pg svg.ink { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .pg svg.ink path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .side { width: 380px; flex: none; border-left: 1px solid rgba(20,20,19,.08); position: relative; }
  .side iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* 圈画模式：页面压一层淡色，底部白胶囊提示（与产品页面状态胶囊同款） */
  .dim { position: absolute; inset: 0; background: rgba(20,20,19,.05); opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  .circling .dim { opacity: 1; }
  .circling .catch { cursor: crosshair; }
  .catch { position: absolute; inset: 0; }
  .hud { position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 8px); opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none;
    background: #fff; border: 1px solid rgba(20,20,19,.08); border-radius: 999px; padding: 6px 14px; font: 400 12px/1.5 var(--font); color: #5f5e58; box-shadow: 0 2px 10px rgba(20,20,19,.08); white-space: nowrap; display: flex; gap: 10px; align-items: center; }
  .hud b { color: #141413; font-weight: 600; }
  .hud kbd { font: 11px var(--font); color: #77756d; border: 1px solid rgba(20,20,19,.12); border-radius: 5px; padding: 0 5px; }
  .circling .hud { opacity: 1; transform: translate(-50%, 0); }
  .num { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--you); color: #fff; font: 600 12.5px/22px var(--font); text-align: center; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(20,20,19,.2); transform: scale(0); transition: transform .22s cubic-bezier(.3,1.5,.5,1); }
  .num.on { transform: scale(1); }
  .num.ai { background: var(--ai); }

  /* 助手在页面上的名牌（与产品手绘圈的名牌同款白卡） */
  .tagcard { position: absolute; background: #fff; color: #141413; border: 1px solid rgba(20,20,19,.08); border-radius: 4px 12px 12px 12px; padding: 6px 12px 6px 9px; font: 400 13px/1.45 var(--font); box-shadow: 0 4px 14px rgba(20,20,19,.10); display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; pointer-events: none; }
  .tagcard.on { opacity: 1; transform: none; }
  .orb-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0abfc, #818cf8 72%); box-shadow: 0 0 6px rgba(129,140,248,.45); }

  /* 网页表单里打出来的字（盖住原占位字） */
  .field { position: absolute; display: flex; align-items: center; background: #fff; font: 700 16.5px/1 "PingFang SC", var(--font); color: #0f294d; white-space: nowrap; overflow: hidden; border-radius: 4px; transition: background .3s, box-shadow .3s; }
  .field.mem { background: linear-gradient(var(--mem-tint), var(--mem-tint)), #fff; box-shadow: inset 0 0 0 1px var(--mem-line); cursor: pointer; pointer-events: auto; }
  .memtag { margin-left: 8px; font: 500 11px/1 var(--font); color: var(--ai); background: #fff; border: 1px solid var(--mem-line); border-radius: 999px; padding: 3px 7px; display: none; align-items: center; gap: 4px; flex: none; }
  .memtag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ai); }
  .field.mem .memtag { display: inline-flex; animation: tagin .25s ease; } @keyframes tagin { from { opacity: 0; } }
  .caret { display: inline-block; width: 1.5px; height: 18px; background: #0f294d; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pop { position: absolute; width: 268px; background: #fff; border: 1px solid #e3e1d9; border-radius: 10px; padding: 10px 12px; box-shadow: 0 8px 26px rgba(20,20,19,.14); font: 400 12.5px/1.55 var(--font); color: #141413; display: grid; gap: 8px; pointer-events: auto; opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }
  .pop.on { opacity: 1; transform: none; }
  .pop .src { color: #5f5e58; }
  .pop .src b { color: #141413; font-weight: 600; }
  .pop .acts { display: flex; gap: 6px; }
  .pop .acts button { font: 500 12px var(--font); border: 1px solid rgba(20,20,19,.12); background: #fff; color: #141413; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  .pop .acts button:hover { background: #f0eee6; }
  .pop .acts button.warn { color: #b54848; }

  /* 光标层（覆盖整个窗口：用户光标与助手光标都能跨到侧栏上） */
  .cursors { position: absolute; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  .cur { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity .2s; will-change: transform; }
  .cur.on { opacity: 1; }
  .cur svg { position: absolute; left: -4px; top: -4.7px; overflow: visible; filter: drop-shadow(0 0 1px #fff) drop-shadow(0 1px 3px rgba(20,20,19,.32)); }
  .cur .pen { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--you); box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(20,20,19,.3); display: none; }
  .cur.drawing svg { display: none; } .cur.drawing .pen { display: block; }
  .cur .lbl { position: absolute; left: 13px; top: 14px; display: inline-flex; gap: 7px; align-items: center; background: #fff; color: #141413; border: 1px solid rgba(20,20,19,.08); border-radius: 4px 12px 12px 12px; padding: 6px 12px 6px 9px; font: 400 13px/1.45 var(--font); white-space: nowrap; box-shadow: 0 4px 14px rgba(20,20,19,.10); opacity: 0; transition: opacity .16s; }
  .cur .lbl.on { opacity: 1; }
  .ripple { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid var(--c, #141413); animation: rip .5s ease-out forwards; }
  @keyframes rip { from { transform: scale(.4); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cur, .num, .tagcard, .pop { transition: none; } }
</style>
</head>
<body>
  <div class="ctl">
    <div class="seg" role="group" aria-label="场景">
      <button type="button" id="sc-circle" aria-pressed="true">圈给它看</button>
      <button type="button" id="sc-memory" aria-pressed="false">记忆露出来</button>
    </div>
    <button type="button" id="play" class="primary">▶ 播放演示</button>
    <button type="button" id="reset">重来</button>
    <div class="narr" id="narr"></div>
  </div>

  <div class="win" id="win">
    <div class="tabbar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="url"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#77756d" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="url"></span></div>
    </div>
    <div class="body">
      <div class="vp" id="vp">
        <div class="pg" id="pg">
          <img class="shot" id="shot" alt="">
          <div class="layer" id="layer"></div>
          <svg class="ink" id="ink"></svg>
          <div class="dim"></div>
          <div class="catch" id="catch"></div>
        </div>
        <div class="hud" id="hud"><span><b>按住拖动</b>圈出想问的地方，可以圈好几处</span><kbd>Esc</kbd><span>退出</span></div>
      </div>
      <div class="side"><iframe id="panel" title="侧栏"></iframe></div>
    </div>
    <div class="cursors" id="cursors">
      <div class="cur" id="you"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" fill="#141413" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg><span class="pen"></span></div>
      <div class="cur" id="ai"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" fill="none" stroke="#0f172a" stroke-width="3.8" stroke-linejoin="round"/><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z" fill="#2d4a86" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg><span class="lbl"><span class="orb-dot"></span><span class="t"></span></span></div>
    </div>
  </div>

<script src="rough.js"></script>
<script>
const PANEL_HTML = __PANEL__;
</script>
<script src="preview.js"></script>
</body>
</html>
