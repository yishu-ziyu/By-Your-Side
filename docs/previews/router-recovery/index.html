<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>中断后，助手怎么接住</title>
<style>
:root{font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#25231f;background:#eae8e1}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:880px;margin:auto}h1{font-size:22px;font-weight:550;margin:0}header p{color:#767167;margin:6px 0 24px}nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}button{font:inherit;cursor:pointer;border:1px solid #25231f17;border-radius:20px;background:transparent;color:#726c61;padding:8px 14px}button[aria-pressed=true]{background:#fff;color:#25231f}.stage{display:flex;align-items:center;gap:30px;padding:28px;background:#f8f7f3;border:1px solid #25231f13;border-radius:24px}.panel{width:350px;flex-shrink:0;min-height:390px;border:1px solid #25231f16;background:#fffefa;border-radius:18px;overflow:hidden}.top{border-bottom:1px solid #25231f0a;padding:12px 18px;display:flex;justify-content:space-between;font-size:12px;color:#6b655c}.messages{padding:22px 18px}.user{margin-left:28px;border-radius:14px;background:#eeece5;padding:10px 14px;margin-bottom:25px}.status{font-size:12px;color:#8b7650;min-height:24px;display:flex;align-items:center;gap:7px}.dot{width:6px;height:6px;border-radius:50%;background:currentColor}.status.busy .dot{animation:pulse 1s infinite}.reply{font-size:15px;margin-top:10px;min-height:140px;white-space:pre-line;transition:opacity .2s}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.input{margin:12px 18px 18px;border-top:1px solid #25231f0c;padding-top:14px;font-size:12px;color:#99938a}.copy{max-width:340px}h2{font-size:25px;font-weight:500;line-height:1.4;margin:0 0 16px}.copy p{color:#746e64}.play{background:#292722;color:white;border:0;margin-top:8px}.foot{font-size:12px;color:#898278;margin-top:18px}[hidden]{display:none!important}@keyframes pulse{50%{opacity:.25}}@media(max-width:740px){body{padding:14px}.stage{flex-direction:column;padding:18px;gap:22px}.panel{width:350px;max-width:100%}.copy{max-width:100%;align-self:stretch}h2{font-size:22px}}@media(prefers-reduced-motion:reduce){.status.busy .dot{animation:none}.reply{transition:none}}
</style>
<main><header><h1>中断后，助手怎么接住</h1><p>建议的使用体验。这里只演示，不调用模型、不操作网页。</p></header>
<nav aria-label="选择中断场景"><button data-case="before" aria-pressed="true">还没回答就掉线</button><button data-case="half" aria-pressed="false">回答一半中断</button><button data-case="action" aria-pressed="false">提交结果不确定</button></nav>
<div class="stage"><div class="panel"><div class="top"><span>By Your Side</span><span>交互演示</span></div><div class="messages"><div class="user"></div><div class="status"><span class="dot"></span><span class="label"></span></div><div class="reply"></div><div class="actions" hidden><button id="confirmed">查到已提交</button><button id="unknown">还是查不清</button></div></div><div class="input">接着说，不用从头重复要求…</div></div><div class="copy"><h2></h2><p class="detail"></p><button class="play">试一下中断后的接话</button><p class="foot">速度是演示，不是实测。备用只使用你允许的服务商，不偷偷转成按量收费。</p></div></div></main>
<script>
const scenes={before:{title:'服务掉线，不让你重新说一遍。',detail:'常用模型暂时不可用，就让已有的备用接同一个要求。只告诉你“已换备用，继续做”，不把排错交给你。',user:'把这三家公司整理成一张对比表。',start:'正在整理…',finish:'已接上备用，继续整理。\n\n你刚才的要求已经保留，不用再说一遍。'},half:{title:'保留内容，接着完成。',detail:'回答一半断了，留下已确认的内容，再补未完成的部分。不把两个模型的半句话硬拼起来。',user:'读这篇文章，帮我讲清楚它的观点。',start:'文章首先说明：可靠的助手，要能保住任务进度。',finish:'刚才回答中断了。我保留了已确认的内容，接着讲剩下的部分。\n\n你也可以改方向，不用重新开始。'},action:{title:'接上备用，也不能重复提交。',detail:'如果网页可能已经提交，只是没收到确认，先检查订单状态。查不清就停在这里，不能再点一次碰运气。',user:'提交这份订单。',start:'网页没有返回提交确认。',finish:'我先查订单有没有提交，避免重复操作。'}};
let current='before',generation=0;const reply=document.querySelector('.reply'),status=document.querySelector('.status'),label=document.querySelector('.label'),play=document.querySelector('.play'),actions=document.querySelector('.actions');
function show(key){current=key;generation++;play.disabled=false;actions.hidden=true;status.classList.remove('busy');label.textContent='等你试一下';reply.textContent=scenes[key].start;document.querySelector('.user').textContent=scenes[key].user;document.querySelector('h2').textContent=scenes[key].title;document.querySelector('.detail').textContent=scenes[key].detail;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.case===key)))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.case));play.onclick=async()=>{const version=++generation;play.disabled=true;status.classList.add('busy');label.textContent=current==='action'?'正在确认是否已提交':'常用模型暂时没接上';await new Promise(r=>setTimeout(r,1000));if(version!==generation)return;status.classList.remove('busy');label.textContent=current==='action'?'先检查，不重复点':'已接上备用';reply.textContent=scenes[current].finish;actions.hidden=current!=='action';play.disabled=false};document.querySelector('#confirmed').onclick=()=>{label.textContent='已确认';reply.textContent='查到订单已经提交成功。\n我不会再提交一次。';actions.hidden=true};document.querySelector('#unknown').onclick=()=>{label.textContent='需要你核对';reply.textContent='现在还查不清是否提交。\n我没有再次提交，请先核对订单记录。';actions.hidden=true};show('before');
</script></html>
