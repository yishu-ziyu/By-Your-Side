<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S2 真实试用：临时模型与标准模型</title><style>*{box-sizing:border-box}body{font:17px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;margin:0;color:#172335;background:#f7f9fc}main{max-width:940px;margin:64px auto;padding:0 28px}small{color:#7b899a}h1{font-size:28px;line-height:1.3;margin:12px 0 30px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:28px}section{background:white;padding:28px;border:1px solid #dce3ed;border-radius:14px;min-height:220px}h2{font-size:23px;margin:0 0 18px}code{font-family:ui-monospace,monospace;color:#3e628b;font-size:18px}.guide{margin-top:34px;padding:20px 24px;border-left:3px solid #3478f6;background:#eef4ff}.guide p{margin:5px 0}.foot{margin-top:20px;color:#8591a0;font-size:13px}@media(max-width:600px){main{margin-top:30px}.cards{grid-template-columns:1fr}section{min-height:180px}}</style><main><small>真实插件试用 · 第 1 步</small><h1>执行中改口，能不能接住？</h1><div class="cards"><section id="temporary-model"><h2>临时模型</h2><code>temporary-model</code><p>这是你最初指定的对象。</p></section><section id="standard-model"><h2>标准模型</h2><code>standard-model</code><p>这是改口后应该圈出的对象。</p></section></div><div class="guide"><p>① 打开扩展语音，说：<strong>“帮我找到临时模型，然后圈出来。”</strong></p><p>② 它开始执行后，说：<strong>“改成标准模型，其他要求不变。”</strong></p></div><p class="foot">只判断：改口是否被接住、是否圈对、等待是否能接受。暂停恢复留到下一步。</p></main></html>
