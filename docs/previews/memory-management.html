<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆管理 · 看 / 改 / 忘 / 找回</title>
<style>
  :root {
    --wallpaper: #f6f4ee;
    --elevated: #fdfcf9;
    --border: rgb(20 20 19 / .10);
    --border-subtle: rgb(20 20 19 / .06);
    --ink: #1c1b17;
    --ink-2: #57534a;
    --ink-3: #8a8375;
    --ink-4: #b3ab9c;
    --accent: #3c8a55;
    --warn: #b54848;
    --pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #fbf9f4, transparent), var(--wallpaper);
    color: var(--ink);
    font: 15px/1.7 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  .meta { display: flex; align-items: center; gap: 12px; }
  .meta .cap { font-size: 12.5px; color: var(--ink-3); }
  .meta .cap b { color: var(--ink-2); font-weight: 600; }
  .meta button {
    border: 1px solid var(--border); background: var(--elevated); color: var(--ink-2);
    font: 12px/1 inherit; padding: 6px 12px; border-radius: var(--pill); cursor: pointer;
  }
  .meta button:hover { color: var(--ink); border-color: rgb(20 20 19 / .28); }
  .hint { font-size: 11.5px; color: var(--ink-4); }

  .panel {
    position: relative; width: 384px; height: 664px;
    background: var(--wallpaper); border: 1px solid var(--border); border-radius: 24px;
    box-shadow: 0 1px 2px rgb(20 20 19 / .04), 0 24px 64px -16px rgb(20 20 19 / .18);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; padding: 14px 20px;
    border-bottom: 1px solid var(--border-subtle); font-size: 14px; font-weight: 600; flex: none;
  }
  .panel-head .icons { margin-left: auto; display: flex; gap: 14px; color: var(--ink-3); font-size: 13px; align-items: center; }
  .panel-head .icons button {
    border: none; background: none; font: 500 13px inherit; color: var(--ink-2); cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; padding: 0;
  }
  .panel-head .icons button:hover { color: var(--ink); }
  .panel-body { position: relative; flex: 1; padding: 20px; overflow: hidden; }

  #convo { display: flex; flex-direction: column; gap: 14px; }
  .bubble {
    align-self: flex-end; background: var(--elevated); border: 1px solid var(--border-subtle);
    border-radius: 18px 18px 6px 18px; padding: 9px 15px; font-size: 13.5px; max-width: 85%;
    box-shadow: 0 1px 3px rgb(20 20 19 / .05);
  }
  .answer {
    background: var(--elevated); border: 1px solid var(--border-subtle); border-radius: 18px;
    padding: 14px 16px; font-size: 13.5px; line-height: 1.75; display: flex; flex-direction: column; gap: 8px;
  }
  .used-toggle {
    border: none; background: none; font: 11.5px inherit; color: var(--ink-3); cursor: pointer;
    padding: 0; width: fit-content; text-decoration: underline; text-underline-offset: 3px;
  }
  .used-toggle:hover { color: var(--ink); }

  .mem-list { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .mem-item {
    background: var(--wallpaper); border: 1px solid var(--border-subtle); border-radius: 12px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.6;
    display: flex; flex-direction: column; gap: 5px;
  }
  .mem-item .mem-meta { font-size: 11px; color: var(--ink-3); }
  .mem-item .mem-acts { display: flex; gap: 12px; align-items: center; }
  .mem-item .mem-acts button {
    border: none; background: none; font: 11.5px inherit; color: var(--ink-2);
    cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px;
  }
  .mem-item .mem-acts button.danger { color: var(--warn); }
  .mem-item.muted { opacity: .55; }
  .mem-item textarea {
    font: 12.5px/1.6 inherit; color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; background: var(--elevated); outline: none;
    resize: vertical; min-height: 50px; width: 100%;
  }
  .mem-item.flash { animation: flash 1s ease-out; }
  @keyframes flash { 0% { background: #f0ead9; } 100% { background: var(--wallpaper); } }
  .manage-link {
    border: none; background: none; font: 12px inherit; color: var(--ink-2); cursor: pointer;
    text-align: left; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; width: fit-content;
  }
  .manage-link:hover { color: var(--ink); }

  .receipt-mem {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2);
    background: var(--elevated); border: 1px solid var(--border-subtle); border-radius: var(--pill);
    padding: 8px 14px; width: fit-content;
  }
  .receipt-mem button {
    border: none; background: none; font: 12px inherit; color: var(--ink); cursor: pointer;
    padding: 0; text-decoration: underline; text-underline-offset: 3px; font-weight: 600;
  }

  /* 记忆抽屉 */
  #drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: 88%; z-index: 6;
    background: var(--wallpaper); border-left: 1px solid var(--border);
    box-shadow: -16px 0 48px rgb(20 20 19 / .14);
    transform: translateX(103%);
    display: flex; flex-direction: column;
  }
  #drawer .d-head {
    display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; flex: none;
  }
  #drawer .d-head strong { font-size: 15px; }
  #drawer .d-head button {
    margin-left: auto; border: none; background: none; font-size: 15px; color: var(--ink-3); cursor: pointer;
  }
  #drawer .d-search { padding: 0 18px 12px; flex: none; }
  #drawer .d-search input {
    width: 100%; font: 13px/1.4 inherit; padding: 9px 14px; color: var(--ink);
    border: 1px solid var(--border); border-radius: var(--pill); background: var(--elevated); outline: none;
  }
  #drawer .d-search input:focus { border-color: rgb(20 20 19 / .32); }
  #drawer .d-body { flex: 1; overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 8px; }
  .mem-group { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; }
  .mem-group:first-child { margin-top: 0; }

  .toast {
    position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 12.5px; padding: 8px 16px;
    border-radius: var(--pill); opacity: 0; transition: opacity .2s;
    pointer-events: none; white-space: nowrap; z-index: 9; display: flex; gap: 8px; align-items: center;
  }
  .toast.show { opacity: 1; pointer-events: auto; }
  .toast button { background: none; border: none; color: #9fc5ff; font: 600 12.5px inherit; cursor: pointer; padding: 0; }

  .composer {
    flex: none; margin: 14px; border: 1px solid var(--border); border-radius: 22px;
    background: var(--elevated); padding: 13px 16px; color: var(--ink-4); font-size: 14px;
    display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2;
  }
  .composer .send {
    width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: 14px;
  }
</style>
</head>
<body>

<div class="meta">
  <span class="cap">记忆管理 · <b>看 / 改 / 忘 / 找回</b></span>
  <button id="correct">✎ 模拟一次纠正</button>
  <button id="replay" title="重播（R）">↻</button>
</div>

<div class="panel">
  <div class="panel-head">新会话 <span class="icons">✎ <button id="mem-open">记忆</button> ⋯</span></div>
  <div class="panel-body">
    <div id="convo">
      <div class="bubble">下周训练怎么安排？</div>
      <div class="answer" id="answer">
        <span>下周以减量恢复为主：周中两次轻松跑，各 40 分钟；周末一次 14 公里有氧。配速不用追，保持能说话的强度。</span>
        <button class="used-toggle" id="used-toggle">用了 2 条记忆 ›</button>
        <div class="mem-list" id="used-list" hidden></div>
        <button class="manage-link" id="manage-link" hidden>管理全部记忆 →</button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <div id="drawer" hidden>
    <div class="d-head"><strong>记忆</strong><button id="drawer-close">✕</button></div>
    <div class="d-search"><input id="search" placeholder="搜索记忆…"></div>
    <div class="d-body" id="d-body"></div>
  </div>
  <div class="composer">说说你想完成什么… <span class="send">↑</span></div>
</div>

<span class="hint">点「用了 2 条记忆 ›」或顶栏「记忆」· 搜索、改、忘掉都能试 · R 复位</span>

const MEMORIES = [

function memItem(m, { inAnswer = false } = {}) {
  const item = document.createElement("div");
  item.className = "mem-item";
  item.dataset.id = m.id;
  item.dataset.search = m.text.toLowerCase();
  let text = document.createElement("span");
  text.className = "mem-text";
  text.textContent = m.text;
  const meta = document.createElement("span");
  meta.className = "mem-meta";
  meta.textContent = m.meta;
  const acts = document.createElement("div");
  acts.className = "mem-acts";
  item.append(text, meta, acts);

    item.classList.add("muted");
    meta.textContent = m.meta + " · 此对话不再使用";

  if (inAnswer && !notHere.has(m.id)) {
    const nh = document.createElement("button");
    nh.textContent = "这里别用";

      notHere.add(m.id);
      item.classList.add("muted");
      meta.textContent = m.meta + " · 此对话不再使用";

      undo.textContent = "恢复";
      undo.onclick = () => { notHere.delete(m.id); renderUsedList(); };
      acts.prepend(undo);

    acts.appendChild(nh);

  edit.textContent = "改";
  edit.onclick = () => {
    if (edit.textContent === "改") {
      const ta = document.createElement("textarea");
      ta.value = text.textContent;
      text.replaceWith(ta);
      ta.focus();
      edit.textContent = "存";
    } else {
      const ta = item.querySelector("textarea");
      m.text = ta.value;
      item.dataset.search = ta.value.toLowerCase();
      const span = document.createElement("span");
      span.className = "mem-text";
      span.textContent = ta.value;
      ta.replaceWith(span);

    qs("#manage-link").hidden = false;
    await expand(list);
    for (const [i, item] of [...list.children].entries()) {
      item.style.opacity = "0"; item.style.transform = "translateY(8px)";
      setTimeout(() => spring({ ms: 380, onUpdate: (p) => {
        item.style.opacity = String(Math.min(1, p));
        item.style.transform = `translateY(${((1 - p) * 8).toFixed(2)}px)`;
      } }), reduced ? 0 : i * 70);
    }
  } else {
    await collapse(list, () => { list.hidden = true; list.style.maxHeight = ""; });
    qs("#manage-link").hidden = true;
  }
});

/* ═══ 抽屉 ═══ */
let drawerOpen = false;
async function openDrawer() {
  if (drawerOpen) return; drawerOpen = true;
  renderDrawer();
  const d = qs("#drawer");
  d.hidden = false;
  await spring({ ms: 460, zeta: 0.82, onUpdate: (p) => {
    d.style.transform = `translateX(${((1 - p) * 103).toFixed(2)}%)`;
  } });
  qs("#search").focus();
}
async function closeDrawer() {
  const d = qs("#drawer");
  await spring({ ms: 340, zeta: 1, onUpdate: (p) => {
    d.style.transform = `translateX(${(p * 103).toFixed(2)}%)`;
  } });
  d.hidden = true; drawerOpen = false;
}
function renderDrawer() {
  const body = qs("#d-body");
  body.innerHTML = "";
  const groups = [...new Set(MEMORIES.map(m => m.scope))];
  for (const g of groups) {
    const items = MEMORIES.filter(m => m.scope === g && !forgotten.has(m.id));
    if (!items.length) continue;
    const head = document.createElement("div");
    head.className = "mem-group";
    head.dataset.group = g;
    head.textContent = `${g} · ${items.length} 条`;
    body.appendChild(head);
    for (const m of items) body.appendChild(memItem(m));
  }
  applySearch();
}
function refreshGroups() { renderDrawer(); }
function applySearch() {
  const q = qs("#search").value.trim().toLowerCase();
  for (const item of document.querySelectorAll("#d-body .mem-item")) {
    item.hidden = !!q && !item.dataset.search.includes(q);
  }
  for (const head of document.querySelectorAll("#d-body .mem-group")) {
    let el = head.nextElementSibling, any = false, n = 0;
    while (el && !el.classList.contains("mem-group")) {
      if (el.classList.contains("mem-item") && !el.hidden) { any = true; n++; }
      el = el.nextElementSibling;
    }
    head.hidden = !any;
    head.textContent = `${head.dataset.group} · ${n} 条`;
  }
}
qs("#search").addEventListener("input", applySearch);
qs("#drawer-close").addEventListener("click", closeDrawer);
qs("#mem-open").addEventListener("click", () => drawerOpen ? closeDrawer() : openDrawer());
qs("#manage-link").addEventListener("click", openDrawer);

/* ═══ 模拟一次纠正：回执 → 查看 → 抽屉里多一条 ═══ */
let corrected = false;
qs("#correct").addEventListener("click", async () => {
  if (corrected) return; corrected = true;
  const m = { id: "m4", scope: "全局", text: "下周比赛周，训练建议要先说减量", meta: "来自刚才的纠正", used: false };
  MEMORIES.unshift(m);
  const receipt = document.createElement("div");
  receipt.className = "receipt-mem";
  receipt.appendChild(stillOrb(16));
  const label = document.createElement("span");
  label.textContent = "已整理这次纠正 · ";
  const view = document.createElement("button");
  view.textContent = "查看";
  view.onclick = async () => {
    await openDrawer();
    const item = document.querySelector('#d-body .mem-item[data-id="m4"]');
    if (item) { item.classList.add("flash"); item.scrollIntoView({ block: "nearest" }); }
  };
  receipt.append(label, view);
  receipt.style.opacity = "0"; receipt.style.transform = "translateY(10px)";
  qs("#convo").appendChild(receipt);
  spring({ ms: 460, onUpdate: (p) => {
    receipt.style.opacity = String(Math.min(1, p));
    receipt.style.transform = `translateY(${((1 - p) * 10).toFixed(2)}px)`;
  } });
});

/* ═══ 复位 ═══ */
function reset() {
  forgotten.clear(); notHere.clear(); corrected = false;
  MEMORIES.splice(MEMORIES.findIndex(m => m.id === "m4"), MEMORIES.some(m => m.id === "m4") ? 1 : 0);
  for (const m of MEMORIES) if (INITIAL_TEXTS[m.id]) m.text = INITIAL_TEXTS[m.id];
  qs("#convo").querySelectorAll(".receipt-mem").forEach(e => e.remove());
  qs("#search").value = "";
  usedOpen = false;
  qs("#used-list").hidden = true; qs("#used-list").style.maxHeight = "";
  qs("#manage-link").hidden = true;
  qs("#used-toggle").textContent = "用了 2 条记忆 ›";
  if (drawerOpen) { qs("#drawer").hidden = true; qs("#drawer").style.transform = "translateX(103%)"; drawerOpen = false; }
}
qs("#replay").addEventListener("click", reset);
addEventListener("keydown", (e) => { if (e.key === "r" || e.key === "R") reset(); });
</script>
