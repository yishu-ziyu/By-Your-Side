let current='correct',step=0;
function pane(v){let tone=v.state==='已完成'?'done':v.state==='已暂停'?'paused':['圈错了','记录不可靠','记录还在等'].includes(v.state)?'warn':'';return `<div class="scene"><div class="url"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>模型说明 · 当前页面</span></div><div class="webpage"><h3>接口说明</h3><div class="object ${v.removed?'removed':''} ${v.mark==='x'?'marked':''}"><span>${v.removed?'临时模型 X 已移除':'临时模型 X'}</span><small>${v.removed?'新页面':'临时模型 ID'}</small></div><div class="object ${v.mark==='y'?'marked':''}"><span>标准模型 Y</span><small>标准模型 ID</small></div></div></div><div class="task"><div class="state"><span>任务状态示意</span><strong class="${tone}">${v.state}</strong></div><p class="message">${v.msg}</p><div class="checks">${v.checks.map(c=>`<span class="check ${c.startsWith('✓')?'ok':c.startsWith('○')?'wait':c.includes('补充')?'blue':''}">${c}</span>`).join('')}</div></div>`;}
function render(){let c=cases[current];document.querySelectorAll('[data-case]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.case===current)));document.querySelector('#title').textContent=c.title;document.querySelector('#subtitle').textContent=c.sub;document.querySelector('#before').innerHTML=pane(c.frames[step][0]);document.querySelector('#after').innerHTML=pane(c.frames[step][1]);document.querySelector('#event').textContent=c.events[step];document.querySelector('#stepcount').textContent=`第 ${step+1} / ${c.frames.length} 步`;document.querySelector('#next').textContent=c.actions[step];document.querySelector('#dots').innerHTML=c.frames.map((_,i)=>`<i class="${i<=step?'active':''}"></i>`).join('');document.querySelector('#shotA').src=images[c.shots[0]];document.querySelector('#shotB').src=images[c.shots[1]];document.querySelector('#shotCaptionA').textContent=c.captions[0];document.querySelector('#shotCaptionB').textContent=c.captions[1];document.querySelector('#evidenceNote').textContent=c.note;}
document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{current=b.dataset.case;step=0;render()});document.querySelector('#next').onclick=()=>{step=(step+1)%cases[current].frames.length;render()};document.querySelector('#reset').onclick=()=>{step=0;render()};const zoom=document.querySelector('#zoom');document.querySelectorAll('.shots img').forEach(img=>img.onclick=()=>{zoom.querySelector('img').src=img.src;zoom.showModal()});zoom.querySelector('button').onclick=()=>zoom.close();zoom.onclick=e=>{if(e.target===zoom)zoom.close()};render();
</script></html>
