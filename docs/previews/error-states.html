<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出错与恢复 · 三个场景</title>
<style>
  :root {
    --wallpaper: #f6f4ee;
    --elevated: #fdfcf9;
    --border: rgb(20 20 19 / .10);
    --border-subtle: rgb(20 20 19 / .06);
    --ink: #1c1b17;
    --ink-2: #57534a;
    --ink-3: #8a8375;
    --ink-4: #b3ab9c;
    --accent: #3c8a55;
    --warn: #b54848;
    --pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #fbf9f4, transparent), var(--wallpaper);
    color: var(--ink);
    font: 15px/1.7 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; overflow: hidden; -webkit-font-smoothing: antialiased;
  }

  .meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .meta .cap { font-size: 12.5px; color: var(--ink-3); }
  .meta .cap b { color: var(--ink-2); font-weight: 600; }
  .meta > button {
    border: 1px solid var(--border); background: var(--elevated); color: var(--ink-2);
    font: 12px/1 inherit; padding: 6px 12px; border-radius: var(--pill); cursor: pointer;
  }
  .meta > button:hover { color: var(--ink); border-color: rgb(20 20 19 / .28); }
  .seg {
    position: relative; display: flex; gap: 2px;
    background: rgb(20 20 19 / .05); border-radius: var(--pill); padding: 3px;
  }
  .seg .pill {
    position: absolute; top: 3px; bottom: 3px; border-radius: var(--pill);
    background: var(--elevated); box-shadow: 0 1px 4px rgb(20 20 19 / .14);
  }
  .seg button {
    position: relative; z-index: 1; border: none; background: none; cursor: pointer;
    font: 500 12px/1 inherit; color: var(--ink-2); padding: 7px 14px; border-radius: var(--pill);
  }
  .seg button.sel { color: var(--ink); font-weight: 600; }
  .hint { font-size: 11.5px; color: var(--ink-4); }

  .panel {
    position: relative; width: 384px; height: 664px;
    background: var(--wallpaper); border: 1px solid var(--border); border-radius: 24px;
    box-shadow: 0 1px 2px rgb(20 20 19 / .04), 0 24px 64px -16px rgb(20 20 19 / .18);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; padding: 14px 20px;
    border-bottom: 1px solid var(--border-subtle); font-size: 14px; font-weight: 600; flex: none;
  }
  .panel-head .icons { margin-left: auto; display: flex; gap: 12px; color: var(--ink-3); font-size: 13px; }
  .panel-body { position: relative; flex: 1; padding: 20px; overflow: hidden; display: flex; flex-direction: column; }

  #stage { display: flex; flex-direction: column; gap: 14px; }
  .bubble {
    align-self: flex-end; background: var(--elevated); border: 1px solid var(--border-subtle);
    border-radius: 18px 18px 6px 18px; padding: 9px 15px; font-size: 13.5px; max-width: 85%;
    box-shadow: 0 1px 3px rgb(20 20 19 / .05);
  }
  .reply { display: flex; gap: 10px; align-items: flex-start; }
  .reply .text { font-size: 13.5px; line-height: 1.75; padding-top: 1px; }
  .reply .text .ln { display: block; }
  .reply .text .cut { color: var(--ink-3); }
  .mem-line { font-size: 11.5px; color: var(--ink-3); margin-left: 30px; }

  .card {
    background: var(--elevated); border: 1px solid var(--border); border-radius: 18px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative;
  }
  .card.err { border-left: 3px solid var(--warn); }
  .card .head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
  .card .head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .card p { font-size: 13px; color: var(--ink-2); line-height: 1.65; }
  .card .note { font-size: 12px; color: var(--ink-3); }
  .btn {
    border: none; cursor: pointer; font: 600 13px/1 inherit;
    padding: 10px 18px; border-radius: var(--pill); width: fit-content;
    transition: filter .15s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .45; cursor: default; filter: none; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-quiet { background: transparent; color: var(--ink); border: 1px solid var(--border); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .model-menu {
    position: absolute; z-index: 5; left: 16px; top: calc(100% - 6px);
    border: 1px solid var(--border); border-radius: 14px; background: var(--elevated);
    box-shadow: 0 10px 28px rgb(20 20 19 / .14); overflow: hidden; min-width: 220px;
    transform-origin: top left;
  }
  .model-menu button {
    display: block; width: 100%; text-align: left; border: none; background: none;
    font: 13px/1.5 inherit; color: var(--ink); padding: 10px 14px; cursor: pointer;

  .model-menu button .sub { color: var(--ink-3); font-size: 11.5px; margin-left: 6px; }

    font-size: 12px; color: var(--ink-3); display: inline-flex; gap: 5px; align-items: baseline;

  .model-chip b { color: var(--ink); font-weight: 600; }

    margin-top: 6px; background: rgb(20 20 19 / .05); border-radius: 8px; padding: 8px 10px;

  .status-inline { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .status-inline.err { color: var(--warn); }

    background: var(--elevated); border-top: 1px solid var(--border);

  #sheet .prov { font-size: 12.5px; color: var(--ink-2); display: flex; justify-content: space-between; }
  #sheet input {
    width: 100%; font: 14px/1.5 inherit; color: var(--ink); background: transparent;
    border: none; border-bottom: 1.5px solid var(--border); padding: 9px 2px; outline: none;

  #sheet input:focus { border-bottom-color: var(--ink); }
  #sheet .note { font-size: 11.5px; color: var(--ink-3); }
  #sheet .row { display: flex; gap: 10px; align-items: center; min-height: 38px; }
  #sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--border); align-self: center; }

  .toast {
    position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 12.5px; padding: 8px 16px;
    border-radius: var(--pill); opacity: 0; transition: opacity .2s;
    pointer-events: none; white-space: nowrap; z-index: 8;
  }
  .toast.show { opacity: 1; }

  .composer {
    flex: none; margin: 14px; border: 1px solid var(--border); border-radius: 22px;
    background: var(--elevated); padding: 13px 16px; color: var(--ink-4); font-size: 14px;
    display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 2;
  }
  .composer .send {
    width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: 14px;
  }

  <span class="cap">出错与恢复 · <b id="cap">401 · key 无效</b></span>

      <button class="btn btn-primary" id="sheet-save" disabled>保存并继续</button>
      <span class="status-inline" id="sheet-status"></span>
    </div>
  </div>
  <div class="composer">说说你想完成什么… <span class="send">↑</span></div>
</div>

<span class="hint">上方切换三种错误 · 每个场景都能修到底 · R 重播当前场景</span>

const FULL = [
  "这一页最核心的三件事——",
  "① 作者在论证「少，但更好」的设计立场；",
  "② 两组前后对比数据，留存提升 32%；",
  "③ 文末附了一份可下载的检查清单。",
];

let kind = "401", running = false;

function cardHTML(k) {
  const s = SCEN[k];
  const btns = k === "401"
    ? '<button class="btn btn-primary" data-a="fix">去换 key</button><button class="btn btn-quiet" data-a="retry-anyway">仍然重试</button>'
    : k === "429"
      ? '<button class="btn btn-primary" data-a="menu">换一个模型 ▾</button><button class="btn btn-quiet" data-a="later">稍后重试</button>'
      : '<button class="btn btn-primary" data-a="retry-net">重试</button>';
  const note = k === "net" ? '<p class="note">网络恢复后会自动重试一次，不用盯着。</p>' : "";
  const menu = k === "429"
    ? '<div class="model-menu" hidden><button data-m="Kimi K2（另一个 key）">Kimi K2 <span class="sub">另一个 key · 快</span></button><button data-m="DeepSeek V3">DeepSeek V3 <span class="sub">已配置</span></button><button data-m="__settings">去设置里加新模型…</button></div>'
    : "";
  return `<div class="card err" id="card">
    <div class="head"><span class="dot"></span>${s.title}</div>
    <p>${s.copy}</p>
    <div class="btn-row">${btns}<span class="model-chip" hidden></span></div>
    ${menu}${note}
    <details class="tech"><summary>技术详情</summary><pre>${s.tech}</pre></details>
  </div>`;
}

async function loadScenario(k) {
  if (running) return;
  running = true; kind = k;
  qs("#cap").textContent = SCEN[k].cap;
  qs("#net-toggle").hidden = k !== "net";
  qs("#sheet").hidden = true; qs("#sheet").style.transform = "translateY(105%)";
  const stage = qs("#stage");
  stage.innerHTML = `
    <div class="bubble">帮我概括这一页，顺便存下重点</div>
    <div class="reply"><div class="orb-slot" style="width:20px;height:20px;flex:none;margin-top:2px"></div><div class="text"><span class="ln cut"></span></div></div>`;
  const bubble = stage.querySelector(".bubble");
  rise(bubble);
  await wait(250);
  await dockOrb(stage.querySelector(".orb-slot"));
  orb.setState("solving"); orb.setLive(true);
  const ln = stage.querySelector(".ln");
  await streamText(ln, PARTIAL, 40);
  await wait(500);
  // 失败定格：光球停住，半截的话变灰
  orb.setLive(false);
  ln.textContent = PARTIAL + " ▌";
  const card = document.createElement("div");
  card.innerHTML = cardHTML(k);
  stage.appendChild(card.firstElementChild);
  const cardEl = qs("#card");
  rise(cardEl);
  wireCard(cardEl, k);
  running = false;
}

function wireCard(card, k) {
  if (k === "401") {
    card.querySelector('[data-a="fix"]').addEventListener("click", openSheet);
    card.querySelector('[data-a="retry-anyway"]').addEventListener("click", async () => {
      spring({ ms: 480, zeta: 0.25, onUpdate: (p) => {
        card.style.transform = `translateX(${(Math.sin(p * Math.PI * 3) * (1 - p) * 5).toFixed(2)}px)`;
      } });
      toast("还是 401：key 没换，重试结果一样");
    });
  }
  if (k === "429") {
    const menu = card.querySelector(".model-menu");
    card.querySelector('[data-a="menu"]').addEventListener("click", async () => {
      if (menu.hidden) {
        menu.hidden = false;
        spring({ ms: 320, zeta: 0.8, onUpdate: (p) => {
          menu.style.opacity = String(Math.min(1, p));
          menu.style.transform = `scale(${0.92 + 0.08 * p})`;
        } });
        for (const [i, b] of [...menu.querySelectorAll("button")].entries()) rise(b, 60 + i * 50);
      } else menu.hidden = true;
    });
    for (const b of menu.querySelectorAll("button")) {
      b.addEventListener("click", async () => {
        menu.hidden = true;
        if (b.dataset.m === "__settings") { toast("打开「模型与语音」"); return; }
        const chip = card.querySelector(".model-chip");
        chip.hidden = false;
        chip.innerHTML = `kimi-k2 → <b>${b.dataset.m.split("（")[0]}</b>`;
        rise(chip);
        const primary = card.querySelector('[data-a="menu"]');
        primary.textContent = "重试"; primary.dataset.a = "retry-now";
        card.querySelector('[data-a="later"]').remove();
        primary.replaceWith(primary.cloneNode(true));
        card.querySelector('[data-a="retry-now"]').addEventListener("click", () => recover("已切到 " + b.dataset.m.split("（")[0]));
        toast("已切换，点「重试」即可继续");
      });
    }
    card.querySelector('[data-a="later"]').addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      for (let i = 4; i >= 1; i--) { btn.textContent = `${i} 秒后自动重试…`; await wait(1000); }
      recover("已自动重试");
    });
  }
  if (k === "net") {
    card.querySelector('[data-a="retry-net"]').addEventListener("click", () => {
      spring({ ms: 480, zeta: 0.25, onUpdate: (p) => {
        card.style.transform = `translateX(${(Math.sin(p * Math.PI * 3) * (1 - p) * 5).toFixed(2)}px)`;
      } });
      toast("还连不上，等网络恢复");
    });
  }
}
qs("#net-toggle").addEventListener("click", () => {
  qs("#net-toggle").hidden = true;
  recover("网络恢复，自动重试");
});

/* ═══ 换 key 底部表单 ═══ */
let sheetOpen = false;
async function openSheet() {
  if (sheetOpen) return; sheetOpen = true;
  const sheet = qs("#sheet");
  sheet.hidden = false;
  const save = qs("#sheet-save");
  save.disabled = true;
  qs("#sheet-status").className = "status-inline"; qs("#sheet-status").textContent = "";
  await spring({ ms: 520, zeta: 0.8, onUpdate: (p) => {
    sheet.style.transform = `translateY(${((1 - p) * 105).toFixed(2)}%)`;
  } });
  qs("#sheet-key").focus();
}
async function closeSheet() {
  const sheet = qs("#sheet");
  await spring({ ms: 380, zeta: 1, onUpdate: (p) => {
    sheet.style.transform = `translateY(${(p * 105).toFixed(2)}%)`;
  } });
  sheet.hidden = true; sheetOpen = false;
}
let sheetTesting = false;
qs("#sheet-test").addEventListener("click", async () => {
  if (sheetTesting) return;
  const key = qs("#sheet-key").value.trim();
  const st = qs("#sheet-status");
  st.className = "status-inline";
  if (key.length < 8) { st.classList.add("err"); st.textContent = "key 好像不完整。"; return; }
  sheetTesting = true;
  st.textContent = "正在测试…";
  await wait(900);
  st.classList.add("ok");
  st.innerHTML = CHECK + "<span>连上了 · 0.8s</span>";
  st.querySelector("path").style.animation = "draw .4s ease-out forwards";
  qs("#sheet-save").disabled = false;
  sheetTesting = false;
});
qs("#sheet-save").addEventListener("click", async () => {
  await closeSheet();
  recover("已换 key");
});

/* ═══ 恢复：从出错处继续 ═══ */
async function recover(source) {
  if (running) return; running = true;
  const card = qs("#card");
  // 卡片收拢成一行重试状态
  card.innerHTML = `<div class="status-inline"><div class="orb-slot" style="width:16px;height:16px"></div><span>${source}，正在从出错处继续…</span></div>`;
  card.classList.remove("err");
  await dockOrb(card.querySelector(".orb-slot"));
  orb.setState("solving"); orb.setLive(true);
  await wait(1100);
  // 卡片退场
  await spring({ ms: 320, zeta: 1, onUpdate: (p) => {
    card.style.opacity = String(1 - p);
    card.style.transform = `translateY(${(-8 * p).toFixed(2)}px)`;
  } });
  card.remove();
  // 光球回到回答旁，续写完整答案
  const replySlot = document.querySelector(".reply .orb-slot");
  const ln = document.querySelector(".reply .ln");
  const textEl = document.querySelector(".reply .text");
  ln.remove();
  await dockOrb(replySlot);
  orb.setState("composing");
  for (const line of FULL) {
    const el = document.createElement("span");
    el.className = "ln";
    textEl.appendChild(el);
    await streamText(el, line, 36);
  }
  orb.setLive(false); orb.setState("breathing"); orb.paintStill();
  const mem = document.createElement("span");
  mem.className = "mem-line"; mem.textContent = "用了 1 条记忆 ›"; mem.style.opacity = "0";
  qs("#stage").appendChild(mem);
  spring({ ms: 400, onUpdate: p => { mem.style.opacity = String(p); } });
  const receipt = document.createElement("div");
  receipt.className = "receipt";
  receipt.innerHTML = CHECK + `<span>出过错 · ${source}，已从出错处继续</span>`;
  receipt.style.opacity = "0";
  qs("#stage").appendChild(receipt);
  spring({ ms: 400, onUpdate: p => { receipt.style.opacity = String(p); } });
  running = false;
}

/* ═══ 主控 ═══ */
const scen = qs("#scen"), scenPill = qs("#scen-pill");
function moveScenPill(btn, instant) {
  const r = btn.getBoundingClientRect(), host = scen.getBoundingClientRect();
  const x = r.left - host.left, w = r.width;
  if (instant || reduced) { scenPill.style.left = x + "px"; scenPill.style.width = w + "px"; return; }
  const from = { x: parseFloat(scenPill.style.left || x), w: parseFloat(scenPill.style.width || w) };
  spring({ ms: 360, zeta: 0.75, onUpdate: (p) => {
    scenPill.style.left = from.x + (x - from.x) * p + "px";
    scenPill.style.width = from.w + (w - from.w) * p + "px";
  } });
}
for (const btn of scen.querySelectorAll("button")) {
  btn.addEventListener("click", () => {
    scen.querySelector(".sel").classList.remove("sel");
    btn.classList.add("sel"); moveScenPill(btn);
    qs("#sheet-key").value = "";
    loadScenario(btn.dataset.k);
  });
}
qs("#replay").addEventListener("click", () => { qs("#sheet-key").value = ""; loadScenario(kind); });
addEventListener("keydown", (e) => { if (e.key === "r" || e.key === "R") loadScenario(kind); });

moveScenPill(scen.querySelector(".sel"), true);
loadScenario("401");
</script>
</body>
</html>
