<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首启引导 · 光球向导</title>
<style>
  :root {
    --wallpaper: #f6f4ee;
    --elevated: #fdfcf9;
    --border: rgb(20 20 19 / .10);
    --border-subtle: rgb(20 20 19 / .06);
    --ink: #1c1b17;
    --ink-2: #57534a;
    --ink-3: #8a8375;
    --ink-4: #b3ab9c;
    --accent: #3c8a55;
    --warn: #b54848;
    --pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #fbf9f4, transparent),
      var(--wallpaper);
    color: var(--ink);
    font: 15px/1.7 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── 舞台外层：说明与重播 ── */
  .meta { display: flex; align-items: baseline; gap: 14px; }
  .meta .cap { font-size: 12.5px; color: var(--ink-3); letter-spacing: .02em; }
  .meta .cap b { color: var(--ink-2); font-weight: 600; }
  .meta button {
    border: 1px solid var(--border); background: var(--elevated); color: var(--ink-2);
    font: 12px/1 inherit; padding: 6px 12px; border-radius: var(--pill); cursor: pointer;
  }
  .meta button:hover { color: var(--ink); border-color: rgb(20 20 19 / .28); }
  .hint { font-size: 11.5px; color: var(--ink-4); }

  /* ── 侧栏 ── */
  .panel {
    position: relative; width: 384px; height: 664px;
    background: var(--wallpaper); border: 1px solid var(--border); border-radius: 24px;
    box-shadow: 0 1px 2px rgb(20 20 19 / .04), 0 24px 64px -16px rgb(20 20 19 / .18);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; padding: 14px 20px;
    border-bottom: 1px solid var(--border-subtle); font-size: 14px; font-weight: 600; flex: none;
  }
  .panel-head .icons { margin-left: auto; display: flex; gap: 12px; color: var(--ink-3); font-size: 13px; }
  .panel-body { position: relative; flex: 1; padding: 0 28px; overflow: hidden; }

  /* 进度点 */
  .dots { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 3; }
  .dots i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--ink-4);
    transition: background .3s;
  }
  .dots i.done { background: var(--ink-3); }
  .dots i.cur { background: var(--ink); }

  /* ── 步骤 ── */
  .step {
    position: absolute; inset: 0; padding: 64px 28px 24px;
    display: flex; flex-direction: column;
  }
  .step.center { align-items: center; text-align: center; }
  .step h1 { font-size: 24px; font-weight: 650; letter-spacing: .01em; line-height: 1.35; }
  .step h2 { font-size: 20px; font-weight: 650; letter-spacing: .01em; line-height: 1.4; }
  .step .sub { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; margin-top: 6px; }
  .rise { opacity: 0; will-change: transform, opacity; }

  .orb-slot { flex: none; }

  .btn {
    border: none; cursor: pointer; font: 600 13.5px/1 inherit;
    padding: 12px 24px; border-radius: var(--pill); width: fit-content;
    transition: filter .15s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-quiet { background: transparent; color: var(--ink); border: 1px solid var(--border); }
  .btn-quiet:hover { border-color: rgb(20 20 19 / .3); filter: none; }

  /* 服务商分段选择 */
  .seg {
    position: relative; display: flex; gap: 2px; margin-top: 26px;
    background: rgb(20 20 19 / .05); border-radius: var(--pill); padding: 3px;
  }
  .seg .pill {
    position: absolute; top: 3px; bottom: 3px; border-radius: var(--pill);
    background: var(--elevated); box-shadow: 0 1px 4px rgb(20 20 19 / .14); z-index: 0;
  }
  .seg button {
    position: relative; z-index: 1; flex: 1; border: none; background: none; cursor: pointer;
    font: 500 12.5px/1 inherit; color: var(--ink-2); padding: 8px 4px; border-radius: var(--pill);
    transition: color .2s;
  }
  .seg button.sel { color: var(--ink); font-weight: 600; }

  .key-wrap { margin-top: 14px; position: relative; }
  .key-wrap input {
    width: 100%; font: 14px/1.5 inherit; color: var(--ink);
    background: transparent; border: none; border-bottom: 1.5px solid var(--border);
    padding: 10px 2px; outline: none; transition: border-color .25s;
  }
  .key-wrap input::placeholder { color: var(--ink-4); }
  .key-wrap input:focus { border-bottom-color: var(--ink); }
  .key-note { font-size: 11.5px; color: var(--ink-3); margin-top: 8px; }

  .test-row { display: flex; align-items: center; gap: 12px; margin-top: 24px; min-height: 40px; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--warn); }
  .status svg { flex: none; }
  .status svg path { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .status.ok svg path { animation: draw .4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* 第一步对话 chips */
  .chips { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .chip {
    border: 1px solid var(--border); background: var(--elevated); border-radius: 16px;
    padding: 12px 16px; font: 13.5px/1.5 inherit; color: var(--ink); text-align: left;
    cursor: pointer; transition: border-color .2s, transform .15s ease;
  }
  .chip:hover { border-color: rgb(20 20 19 / .3); transform: translateY(-1px); }
  .chip .sub2 { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }

  /* 对话 */
  .convo { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
  .bubble {
    align-self: flex-end; background: var(--elevated); border: 1px solid var(--border-subtle);
    border-radius: 18px 18px 6px 18px; padding: 9px 15px; font-size: 13.5px; max-width: 85%;
    box-shadow: 0 1px 3px rgb(20 20 19 / .05);
  }
  .reply { display: flex; gap: 10px; align-items: flex-start; }
  .reply .text { font-size: 13.5px; line-height: 1.75; color: var(--ink); padding-top: 1px; }
  .reply .text .ln { display: block; }
  .reply .text .caret {
    display: inline-block; width: 7px; height: 15px; background: var(--ink);
    vertical-align: -2px; margin-left: 1px; animation: blink .8s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .mem-line {
    font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 4px;
    margin-left: 30px; cursor: pointer;
  }
  .skip-btn {
    margin-top: auto; align-self: center; border: none; background: none; cursor: pointer;
    font: 12.5px/1 inherit; color: var(--ink-3); padding: 10px;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .skip-btn:hover { color: var(--ink); }

  /* 手绘圈层 */
  .sketch-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }
  .sketch-layer path { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linecap: round; opacity: .85; }

  /* 日常空状态（引导结束后） */
  .daily { align-items: center; text-align: center; padding-top: 88px; gap: 22px; }
  .daily .chips { margin-top: 0; align-items: center; }
  .daily .chip { border-radius: var(--pill); padding: 9px 18px; font-size: 13px; color: var(--ink-2); }
  .daily .arrow { font-size: 12px; color: var(--ink-3); }

  .composer {
    flex: none; margin: 14px; border: 1px solid var(--border); border-radius: 22px;
    background: var(--elevated); padding: 13px 16px; color: var(--ink-4); font-size: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    position: relative; z-index: 2;
  }
  .composer .ctext { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .composer .ctext.filled { color: var(--ink); }
  .composer .send {
    width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff;
    display: grid; place-items: center; font-size: 14px; flex: none;
  }
  .composer.ring::after {
    content: ""; position: absolute; inset: -1px; border-radius: 22px;
    border: 1.5px solid var(--ink); opacity: 0;
    animation: ringPulse 1.1s ease-out 2;
  }
  @keyframes ringPulse { 0% { opacity: .5; transform: scale(1); } 100% { opacity: 0; transform: scale(1.045); } }

  /* 飞入输入框的 chip 残影 */
  .ghost {
    position: absolute; z-index: 6; pointer-events: none;
    background: var(--elevated); border: 1px solid var(--border); border-radius: 14px;
    padding: 8px 14px; font-size: 13px; color: var(--ink); box-shadow: 0 6px 18px rgb(20 20 19 / .12);
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="meta">
  <span class="cap">首启引导 · 方案 A′ <b id="cap-step">到来</b></span>
  <button id="replay" title="重播（R）">↻ 重播</button>
</div>

<div class="panel" id="panel">
  <div class="panel-head">新会话 <span class="icons">✎ ▤ ⋯</span></div>
  <div class="panel-body" id="body">
    <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>

    <!-- 0 · 到来 -->
    <section class="step center" data-step="0">
      <div class="orb-slot" id="slot-0" style="width:76px;height:76px;margin:36px 0 26px"></div>
      <h1 class="rise">我是 By Your Side。</h1>
      <p class="sub rise">在每一页旁边，帮你读、帮你做。<br>花 30 秒认识一下。</p>
      <button class="btn btn-primary rise" data-act="next" style="margin-top:30px">开始</button>
    </section>

    <!-- 1 · 连模型 -->
    <section class="step" data-step="1" hidden>
      <div class="orb-slot" id="slot-1" style="width:34px;height:34px"></div>
      <h2 class="rise" style="margin-top:14px">先给我接一个大脑。</h2>
      <p class="sub rise">选一个服务商，粘贴它的 API key。</p>
      <div class="seg rise" id="seg">
        <span class="pill" id="seg-pill"></span>
        <button class="sel">Kimi</button>
        <button>DeepSeek</button>
        <button>自定义</button>
      </div>
      <div class="key-wrap rise" id="url-wrap" hidden>
        <input id="base-url" type="text" placeholder="服务地址，如 https://api.example.com/v1" autocomplete="off">
      </div>
      <div class="key-wrap rise">
        <input id="key" type="password" placeholder="粘贴 API key" autocomplete="off">
        <div class="key-note">key 只存在这台电脑，不会上传。</div>
      </div>
      <div class="test-row rise">
        <button class="btn btn-quiet" id="test">测试连接</button>
        <span class="status" id="status"></span>
      </div>
      <button class="btn btn-primary rise" data-act="next" id="cont-1" hidden style="margin-top:14px">继续 →</button>
      <button class="skip-btn rise" data-act="next">先跳过，随便看看 →</button>
    </section>

    <!-- 2 · 第一次对话 -->
    <section class="step" data-step="2" hidden>
      <h2 class="rise">试一句。</h2>
      <div class="chips" id="chips">
        <button class="chip rise" data-q="概括这一页，给我三个要点">概括这一页，给我三个要点</button>
        <button class="chip rise" data-q="这一页有什么值得记住的？">这一页有什么值得记住的？<span class="sub2">存下来的东西，以后我都记得</span></button>
        <button class="chip rise" data-q="帮我看看这个表单怎么填">帮我看看这个表单怎么填</button>
      </div>
      <div class="convo" id="convo"></div>
      <button class="btn btn-primary rise" data-act="next" id="cont-2" hidden style="margin-top:18px;align-self:flex-end">继续 →</button>
    </section>

    <!-- 3 · 交付 -->
    <section class="step center" data-step="3" hidden>
      <div class="orb-slot" id="slot-3" style="width:64px;height:64px;margin:52px 0 24px"></div>
      <h2 class="rise">以后我就在旁边。</h2>
      <p class="sub rise">任何一页，想让我看一眼，直接说。</p>
      <button class="btn btn-primary rise" data-act="finish" style="margin-top:30px">开始用</button>
    </section>

    <!-- 4 · 日常空状态 -->
    <section class="step center daily" data-step="4" hidden>
      <div class="orb-slot" id="slot-4" style="width:56px;height:56px"></div>
      <div class="chips">
        <button class="chip rise">概括当前页，给我三个要点</button>
        <button class="chip rise">这页有什么值得存下来的？</button>
      </div>
      <span class="arrow rise">或者，直接从下面开始 ↓</span>
    </section>

    <!-- 唯一的真光球 -->
    <div id="orb" style="position:absolute;left:0;top:0;z-index:2;pointer-events:none"></div>
    <svg class="sketch-layer" id="sketch"></svg>
  </div>
  <div class="composer" id="composer">
    <span class="ctext" id="ctext">说说你想完成什么…</span>
    <span class="send">↑</span>
  </div>
</div>

<span class="hint">点面板里的按钮推进 · 按 R 重播</span>

    for (const l of frame.lines) {
      ctx.strokeStyle = shade(l.white, l.a ?? 1); ctx.lineWidth = l.w;
      ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
    }
    for (const d of frame.dots) {
      ctx.fillStyle = shade(d.white, d.a ?? 1);
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  function loop() {
    raf = 0;
    if (live && host.isConnected) { paint(performance.now() / 1000 * preset.speed); raf = requestAnimationFrame(loop); }
  }
  sizeTo(box);
  return {
    get pos() { return pos; }, get box() { return box; },
    place(x, y) { pos = { x, y }; host.style.transform = `translate(${x}px,${y}px)`; },
    scale(s) { host.style.transform = `translate(${pos.x}px,${pos.y}px) scale(${s})`; },
    sizeTo, paintStill: () => paint(STILL_T),
    setState(name) { preset = resolvePreset(name, GEOM); paint(performance.now() / 1000 * preset.speed); },
    setLive(on) { live = on && !reduced; if (live && !raf) raf = requestAnimationFrame(loop); if (!live) paint(STILL_T); },
  };
})();

/* ═══ 手绘描边（移植 extension/src/shared/rough：mulberry32 + sketchFrame） ═══ */
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const sampleLine = (x1, y1, x2, y2, step = 8) => {
  const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / step));
  return Array.from({ length: n + 1 }, (_, i) => [x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
};
const ellipsePoints = (cx, cy, rx, ry, a0, a1, n) =>
  Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
const jitterPts = (pts, rand, amp) => pts.map(([x, y]) => [x + (rand() * 2 - 1) * amp, y + (rand() * 2 - 1) * amp]);
function toPath(pts, close) {
  if (!pts.length) return "";
  let d = `M${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [cx, cy] = pts[i], nx = pts[i + 1];
    d += ` Q${cx.toFixed(2)} ${cy.toFixed(2)} ${((cx + nx[0]) / 2).toFixed(2)} ${((cy + nx[1]) / 2).toFixed(2)}`;
  }
  const last = pts[pts.length - 1];
  d += ` L${last[0].toFixed(2)} ${last[1].toFixed(2)}`;
  return close ? d + " Z" : d;
}
function sketchFrame(target, { seed, roughness }) {
  const rand = mulberry32(seed), amp = 1.1 * roughness;
  if (target.w / Math.max(1, target.h) > 3.2) {
    const pad = 4, b = { x: target.x - pad, y: target.y - pad, w: target.w + pad * 2, h: target.h + pad * 2 };
    const r = Math.min(10, b.h / 2), n = 5;
    const pts = [
      ...sampleLine(b.x + r, b.y, b.x + b.w - r, b.y),
      ...ellipsePoints(b.x + b.w - r, b.y + r, r, r, -Math.PI / 2, 0, n),
      ...sampleLine(b.x + b.w, b.y + r, b.x + b.w, b.y + b.h - r),
      ...ellipsePoints(b.x + b.w - r, b.y + b.h - r, r, r, 0, Math.PI / 2, n),
      ...sampleLine(b.x + b.w - r, b.y + b.h, b.x + r, b.y + b.h),
      ...ellipsePoints(b.x + r, b.y + b.h - r, r, r, Math.PI / 2, Math.PI, n),
      ...sampleLine(b.x, b.y + b.h - r, b.x, b.y + r),
      ...ellipsePoints(b.x + r, b.y + r, r, r, Math.PI, Math.PI * 1.5, n),
    ];
    return toPath(jitterPts(pts, rand, amp), true);
  }
  const cx = target.x + target.w / 2, cy = target.y + target.h / 2;
  const rx = target.w / 2 * 1.25 + 4, ry = target.h / 2 * 1.25 + 4;
  const n = Math.max(24, Math.ceil((Math.PI * (rx + ry)) / 8));
  return toPath(jitterPts(ellipsePoints(cx, cy, rx, ry, 0, Math.PI * 2, n).slice(0, -1), rand, amp), true);
}
function drawSketch(target, { seed = 42, ms = 560 } = {}) {
  const svg = document.getElementById("sketch");
  const body = document.getElementById("body").getBoundingClientRect();
  const d = sketchFrame(target, { seed, roughness: 0.9 });
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", d);
  svg.appendChild(path);
  const len = path.getTotalLength();
  path.style.strokeDasharray = String(len);
  if (reduced) { path.style.strokeDashoffset = "0"; return Promise.resolve(); }
  path.style.strokeDashoffset = String(len);
  const t0 = performance.now();
  return new Promise((resolve) => (function f(now) {
    const p = Math.min(1, (now - t0) / ms);
    path.style.strokeDashoffset = String(len * (1 - (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(f); else resolve();
  })(t0));
}

/* ═══ 步骤机 ═══ */
const steps = [...document.querySelectorAll(".step")];
const dots = [...document.querySelectorAll("#dots i")];
const CAPS = ["到来", "连模型", "第一次对话", "交付", "日常"];
let cur = -1, busy = false;

function rectIn(el) {
  const b = document.getElementById("body").getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left - b.left, y: r.top - b.top, w: r.width, h: r.height };
}
async function dockOrb(slot) {
  const r = rectIn(slot), from = orb.pos, fromBox = orb.box;
  if (reduced) { orb.place(r.x, r.y); orb.sizeTo(r.w); orb.paintStill(); return; }
  await spring({
    ms: 560, zeta: 0.78,
    onUpdate: (p) => {
      orb.place(from.x + (r.x - from.x) * p, from.y + (r.y - from.y) * p);
      orb.scale((fromBox + (r.w - fromBox) * p) / fromBox);
    },
  });
  orb.sizeTo(r.w); orb.place(r.x, r.y); orb.paintStill();
}
function enterEls(els, base = 0) {
  els.forEach((el, i) => setTimeout(() => spring({
    ms: 480, zeta: 0.72,
    onUpdate: (p) => {
      el.style.opacity = String(Math.min(1, p));
      el.style.transform = `translateY(${((1 - p) * 18).toFixed(2)}px)`;
    },
  }), base + i * 75));
  return reduced ? 0 : base + els.length * 75 + 200;
}
async function exitEls(els) {
  await Promise.all(els.map((el, i) => new Promise((res) => setTimeout(() =>
    spring({ ms: 240, zeta: 1, onUpdate: (p) => {
      el.style.opacity = String(1 - p);
      el.style.transform = `translateY(${(-10 * p).toFixed(2)}px)`;
    } }).then(res), i * 35))));
}
function setDots(n) {
  dots.forEach((d, i) => {
    d.className = i < n ? "done" : i === n ? "cur" : "";
    if (i === n && !reduced) spring({ ms: 380, onUpdate: (p) => { d.style.transform = `scale(${1 + 0.5 * Math.sin(p * Math.PI)})`; } });
  });
  document.getElementById("cap-step").textContent = CAPS[n] ?? "";
}
async function goto(n) {
  if (busy) return; busy = true;
  document.getElementById("sketch").replaceChildren();
  const prev = cur >= 0 ? steps[cur] : null, next = steps[n];
  if (prev) { await exitEls([...prev.querySelectorAll(".rise")].filter(e => e.offsetParent)); prev.hidden = true; }
  cur = n; setDots(Math.min(n, 3));
  next.hidden = false;
  const slot = next.querySelector(".orb-slot");
  if (slot) await dockOrb(slot);
  const rises = [...next.querySelectorAll(".rise")].filter(e => !e.hidden && !e.closest("[hidden]"));
  for (const el of rises) { el.style.opacity = "0"; el.style.transform = "translateY(18px)"; }
  enterEls(rises);
  busy = false;
}

/* ═══ 第 1 步：服务商选择 + 测试连接 ═══ */
const seg = document.getElementById("seg"), segPill = document.getElementById("seg-pill");
function moveSegPill(btn, instant) {
  const r = btn.getBoundingClientRect(), host = seg.getBoundingClientRect();
  const x = r.left - host.left, w = r.width;
  if (instant || reduced) { segPill.style.left = x + "px"; segPill.style.width = w + "px"; return; }
  const from = { x: parseFloat(segPill.style.left || x), w: parseFloat(segPill.style.width || w) };
  spring({ ms: 380, zeta: 0.75, onUpdate: (p) => {
    segPill.style.left = from.x + (x - from.x) * p + "px";
    segPill.style.width = from.w + (w - from.w) * p + "px";
  } });
}
for (const btn of seg.querySelectorAll("button")) {
  btn.addEventListener("click", () => {
    seg.querySelector(".sel").classList.remove("sel");
    btn.classList.add("sel"); moveSegPill(btn);
    const urlWrap = document.getElementById("url-wrap");
    const need = btn.textContent === "自定义";
    if (need && urlWrap.hidden) {
      urlWrap.hidden = false;
      spring({ ms: 380, onUpdate: (p) => {
        urlWrap.style.opacity = String(Math.min(1, p));
        urlWrap.style.transform = `translateY(${((1 - p) * 10).toFixed(2)}px)`;
      } });
    } else if (!need) urlWrap.hidden = true;
  });
}

const statusEl = document.getElementById("status");
function streamText(el, text, cps = 26) {
  return new Promise((resolve) => {
    if (reduced) { el.textContent = text; resolve(); return; }
    let i = 0;
    const t = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) { clearInterval(t); resolve(); }
    }, 1000 / cps);
  });
}
const CHECK = '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2.5 7.5 L5.8 10.8 L11.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let testing = false;
document.getElementById("test").addEventListener("click", async () => {
  if (testing) return;
  const key = document.getElementById("key").value.trim();
  const provider = seg.querySelector(".sel").textContent;
  statusEl.className = "status";
  if (provider === "自定义" && !document.getElementById("base-url").value.trim()) {
    statusEl.classList.add("err");
    statusEl.textContent = "自定义服务要先填服务地址。";
    return;
  }
  if (key.length < 8) {
    statusEl.classList.add("err");
    statusEl.textContent = key ? "key 好像不完整，再检查一下。" : "先粘贴 key；没有 key 可以点下方「先跳过」。";
    if (!reduced) spring({ ms: 500, zeta: 0.25, from: 0, onUpdate: (p) => {
      document.getElementById("key").style.transform = `translateX(${(Math.sin(p * Math.PI * 3) * (1 - p) * 6).toFixed(2)}px)`;
    } });
    return;
  }
  testing = true;
  orb.setState("connecting"); orb.setLive(true);
  await streamText(statusEl, `正在连接 ${provider}…`);
  await new Promise(r => setTimeout(r, reduced ? 0 : 700));
  orb.setLive(false); orb.setState("breathing"); orb.paintStill();
  statusEl.classList.add("ok");
  statusEl.innerHTML = CHECK + "<span></span>";
  await streamText(statusEl.querySelector("span"), `连上了：${provider} · 延迟 0.8s`);
  const cont = document.getElementById("cont-1");
  cont.hidden = false;
  spring({ ms: 460, onUpdate: (p) => {
    cont.style.opacity = String(Math.min(1, p));
    cont.style.transform = `translateY(${((1 - p) * 14).toFixed(2)}px)`;
  } });
  testing = false;
});

/* ═══ 第 2 步：第一次对话 ═══ */
const ANSWER = [
  "好。这一页最核心的三件事——",
  "① 作者在论证「少，但更好」的设计立场；",
  "② 两组前后对比数据，留存提升 32%；",
  "③ 文末附了一份可下载的检查清单。",
  "值得多看一眼的是第 ② 条，我替你圈出来了。",
];
let asked = false;
for (const chip of document.querySelectorAll("#chips .chip")) {
  chip.addEventListener("click", () => { if (!asked) { asked = true; runFirstAsk(chip); } });
}
async function runFirstAsk(chip) {
  const convo = document.getElementById("convo");
  const chips = document.getElementById("chips");
  const q = chip.dataset.q;

  // chip 残影飞进输入框
  const from = chip.getBoundingClientRect();
  const comp = document.getElementById("composer");
  const to = comp.getBoundingClientRect();
  const ghost = document.createElement("div");
  ghost.className = "ghost"; ghost.textContent = q;
  ghost.style.left = from.left + "px"; ghost.style.top = from.top + "px";
  document.body.appendChild(ghost);
  for (const c of chips.querySelectorAll(".chip")) { c.style.pointerEvents = "none"; if (c !== chip) spring({ ms: 260, zeta: 1, onUpdate: p => { c.style.opacity = String(1 - p); } }); }
  chip.style.opacity = "0";
  await spring({ ms: 520, zeta: 0.8, onUpdate: (p) => {
    ghost.style.left = from.left + (to.left + 14 - from.left) * p + "px";
    ghost.style.top = from.top + (to.top + 6 - from.top) * p + "px";
    ghost.style.opacity = String(1 - Math.max(0, p - 0.7) / 0.3);
  } });
  ghost.remove();
  const ctext = document.getElementById("ctext");
  ctext.textContent = q; ctext.classList.add("filled");
  await new Promise(r => setTimeout(r, reduced ? 0 : 350));
  spring({ ms: 300, onUpdate: p => { comp.querySelector(".send").style.transform = `scale(${1 + 0.18 * Math.sin(p * Math.PI)})`; } });
  await new Promise(r => setTimeout(r, reduced ? 0 : 280));
  ctext.textContent = "说说你想完成什么…"; ctext.classList.remove("filled");

  // 用户气泡
  chips.style.display = "none";
  const bubble = document.createElement("div");
  bubble.className = "bubble"; bubble.textContent = q;
  convo.appendChild(bubble);
  await spring({ ms: 420, onUpdate: p => {
    bubble.style.opacity = String(Math.min(1, p));
    bubble.style.transform = `translateY(${((1 - p) * 14).toFixed(2)}px)`;
  } });

  // 光球赶到回答旁，进入思考
  const reply = document.createElement("div");
  reply.className = "reply";
  reply.innerHTML = '<div class="orb-slot" style="width:20px;height:20px;flex:none;margin-top:2px"></div><div class="text"></div>';
  convo.appendChild(reply);
  await dockOrb(reply.querySelector(".orb-slot"));
  orb.setState("solving"); orb.setLive(true);
  await new Promise(r => setTimeout(r, reduced ? 0 : 900));

  // 流式回答
  orb.setState("composing");
  const textEl = reply.querySelector(".text");
  const caret = document.createElement("span"); caret.className = "caret";
  for (const line of ANSWER) {
    const ln = document.createElement("span"); ln.className = "ln";
    textEl.appendChild(ln); ln.appendChild(caret);
    await streamText(ln, line, 34);
    ln.appendChild(caret);
  }
  caret.remove();
  orb.setLive(false); orb.setState("breathing"); orb.paintStill();

  // 记忆行
  const mem = document.createElement("span");
  mem.className = "mem-line"; mem.textContent = "用了 1 条记忆 ›"; mem.style.opacity = "0";
  convo.appendChild(mem);
  spring({ ms: 400, onUpdate: p => { mem.style.opacity = String(p); } });

  // 手绘圈：圈出第 ② 条
  await new Promise(r => setTimeout(r, reduced ? 0 : 500));
  const target = textEl.querySelectorAll(".ln")[2];
  const b = document.getElementById("body").getBoundingClientRect();
  const r2 = target.getBoundingClientRect();
  await drawSketch({ x: r2.left - b.left, y: r2.top - b.top, w: r2.width, h: r2.height });

  // 继续
  const cont = document.getElementById("cont-2");
  cont.hidden = false;
  spring({ ms: 460, onUpdate: p => {
    cont.style.opacity = String(Math.min(1, p));
    cont.style.transform = `translateY(${((1 - p) * 14).toFixed(2)}px)`;
  } });
}

/* ═══ 第 3 步：交付——手绘环圈住光球 ═══ */
async function celebrate() {
  const r = rectIn(document.getElementById("slot-3"));
  await drawSketch({ x: r.x - 8, y: r.y - 8, w: r.w + 16, h: r.h + 16 }, { seed: 7, ms: 620 });
}

/* ═══ 完成：日常空状态 + 输入框召唤 ═══ */
async function finish() {
  document.getElementById("sketch").replaceChildren();
  await goto(4);
  document.getElementById("cap-step").textContent = "日常";
  document.getElementById("dots").style.opacity = "0";
  await new Promise(r => setTimeout(r, reduced ? 0 : 900));
  document.getElementById("composer").classList.add("ring");
}

/* ═══ 主控 ═══ */
document.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", async () => {
  const act = btn.dataset.act;
  if (act === "next") await goto(cur + 1);
  else if (act === "finish") await finish();
  if (cur === 3) celebrate();
}));
async function replay() {
  if (busy) return;
  document.getElementById("sketch").replaceChildren();
  document.getElementById("convo").replaceChildren();
  const chips = document.getElementById("chips");
  chips.style.display = "";
  for (const c of chips.querySelectorAll(".chip")) { c.style.opacity = ""; c.style.pointerEvents = ""; c.style.transform = ""; }
  document.getElementById("cont-1").hidden = true;
  document.getElementById("cont-2").hidden = true;
  document.getElementById("key").value = "";
  document.getElementById("base-url").value = "";
  document.getElementById("url-wrap").hidden = true;
  seg.querySelector(".sel").classList.remove("sel");
  seg.querySelector("button").classList.add("sel");
  moveSegPill(seg.querySelector(".sel"), true);
  statusEl.className = "status"; statusEl.textContent = "";
  document.getElementById("dots").style.opacity = "";
  document.getElementById("composer").classList.remove("ring");
  asked = false; testing = false; cur = -1;
  for (const s of steps) s.hidden = true;
  orb.setState("breathing"); orb.setLive(true);
  // 初始：光球从 0 弹出来
  const slot0 = document.getElementById("slot-0");
  steps[0].hidden = false;
  const r = rectIn(slot0);
  orb.place(r.x + r.w / 2, r.y + r.h / 2);
  orb.sizeTo(r.w); orb.scale(0.001); orb.paintStill();
  cur = 0; setDots(0);
  await spring({ ms: 640, zeta: 0.65, onUpdate: p => orb.scale(Math.max(0.001, p)) });
  orb.place(r.x, r.y); orb.paintStill();
  const rises = [...steps[0].querySelectorAll(".rise")];
  for (const el of rises) { el.style.opacity = "0"; el.style.transform = "translateY(18px)"; }
  enterEls(rises, 100);
}
document.getElementById("replay").addEventListener("click", replay);
addEventListener("keydown", (e) => { if (e.key === "r" || e.key === "R") replay(); });

moveSegPill(seg.querySelector(".sel"), true);
replay();
</script>
