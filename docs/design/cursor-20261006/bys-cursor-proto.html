<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>BYS 光标尺寸原型 · 18 / 19 / 20 / 当前</title>
<style>
  :root { --blue:#0b57d0; --ink:#1f1f1f; --mute:#444746; --line:#e0e3e7; --bg:#f8fafd; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font: 14px/1.45 Roboto, "Google Sans", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif; color:var(--ink); background:var(--bg); overflow:hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .ic { width:20px; height:20px; display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .icon-btn { width:40px; height:40px; border-radius:50%; display:grid; place-items:center; color:var(--mute); }
  .icon-btn:hover { background:#e9eef6; }
  /* 顶栏 */
  .top { height:64px; display:flex; align-items:center; gap:4px; padding:0 8px 0 8px; }
  .logo { display:flex; align-items:center; gap:6px; width:228px; padding-left:6px; font: 400 22px/1 "Google Sans", Roboto, sans-serif; color:#444746; }
  .search { flex:1; max-width:720px; height:48px; border-radius:24px; background:#e9eef6; display:flex; align-items:center; gap:12px; padding:0 8px; color:#444746; font-size:16px; }
  .top-right { margin-left:auto; display:flex; align-items:center; gap:2px; }
  .avatar { width:32px; height:32px; border-radius:50%; background:#7a5af5; color:#fff; display:grid; place-items:center; font-weight:500; margin:0 6px 0 8px; }
  /* 左栏 */
  .shell { display:flex; height:calc(100% - 64px); }
  .nav { width:256px; flex:none; padding:8px 16px 0 8px; }
  .compose { display:inline-flex; align-items:center; gap:12px; height:56px; padding:0 22px 0 16px; border-radius:16px; background:#c2e7ff; font-weight:500; color:#001d35; margin:0 0 16px 0; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .nav a { display:flex; align-items:center; gap:18px; height:32px; padding:0 12px 0 26px; border-radius:0 16px 16px 0; color:#202124; text-decoration:none; font-size:14px; }
  .nav a.on { background:#d3e3fd; font-weight:700; color:#001d35; }
  .nav a .n { margin-left:auto; font-size:12px; font-weight:700; }
  .nav h4 { margin:18px 0 6px 26px; font: 500 16px/1 "Google Sans", Roboto, sans-serif; color:#1f1f1f; }
  /* 正文卡 */
  .main { flex:1; background:#fff; border-radius:16px; margin:0 16px 16px 0; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .bar { height:48px; display:flex; align-items:center; gap:4px; padding:0 8px; color:var(--mute); }
  .bar .pg { margin-left:auto; font-size:12px; color:#5e5e5e; padding-right:8px; }
  .thread { flex:1; overflow:auto; padding:6px 0 24px 0; }
  .subject { display:flex; align-items:center; gap:10px; padding:4px 24px 14px 72px; font: 400 22px/1.3 "Google Sans", Roboto, sans-serif; }
  .tag { font-size:12px; background:#ddd; padding:1px 6px; border-radius:4px; color:#444; }
  .msg { display:flex; gap:16px; padding:6px 24px 0 16px; }
  .ava { width:40px; height:40px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font-weight:500; background:#e37400; }
  .msg-h { display:flex; align-items:baseline; gap:6px; }
  .msg-h b { font-weight:700; font-size:14px; }
  .msg-h .addr, .to { color:#5e5e5e; font-size:12px; }
  .msg-h .t { margin-left:auto; font-size:12px; color:#5e5e5e; }
  .body { margin:18px 0 0; font-size:14px; line-height:1.6; color:#222; max-width:720px; }
  .body p { margin:0 0 12px; }
  .actions { display:flex; gap:12px; padding:18px 0 0 72px; }
  .pill { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 22px 0 16px; border:1px solid #747775; border-radius:20px; color:#444746; font-weight:500; }
  .pill:hover { background:#f2f6fc; }
  /* 回复框 */
  .reply { display:none; margin:16px 24px 0 72px; border-radius:16px; box-shadow:0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15); background:#fff; position:relative; }
  .reply.on { display:block; }
  .reply-av { position:absolute; left:-56px; top:2px; width:40px; height:40px; border-radius:50%; background:#7a5af5; color:#fff; display:grid; place-items:center; font-weight:500; }
  .reply-h { display:flex; align-items:center; gap:6px; padding:12px 16px 4px; color:#444746; font-size:14px; }
  .editor { min-height:120px; padding:10px 16px 8px; outline:none; font-size:14px; line-height:1.6; color:#222; white-space:pre-wrap; }
  .editor:empty::before { content: ""; }
  .caret { display:inline-block; width:1px; height:1.15em; background:#1f1f1f; vertical-align:-3px; margin-left:1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation:none; } }
  .tools { display:flex; align-items:center; gap:2px; padding:8px 12px 12px 16px; }
  .send { display:inline-flex; align-items:stretch; height:36px; border-radius:18px; overflow:hidden; background:var(--blue); color:#fff; font-weight:500; margin-right:10px; }
  .send .s { padding:0 16px 0 22px; display:flex; align-items:center; }
  .send .more { width:28px; display:grid; place-items:center; border-left:1px solid rgba(255,255,255,.35); }
  .tools .icon-btn { width:32px; height:32px; }
  .tools .icon-btn .ic { width:18px; height:18px; }
  .tools .trash { margin-left:auto; }
  /* 落点检查十字 */
  .xhair { position:fixed; width:0; height:0; pointer-events:none; z-index:9; }
  .xhair::before, .xhair::after { content:""; position:absolute; background:#ff1744; }
  .xhair::before { left:-9px; top:-.5px; width:18px; height:1px; }
  .xhair::after { top:-9px; left:-.5px; width:1px; height:18px; }
  /* 尺寸对照卡 */
  .refs { position:fixed; left:16px; bottom:20px; z-index:10; background:#fff; border:1px solid #e3e1d9; border-radius:12px; box-shadow:0 6px 24px rgba(20,20,19,.12); padding:12px 14px 10px; font: 12px/1.4 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; color:#3d3b35; }
  .refs h5 { margin:0 0 8px; font-size:12px; font-weight:600; }
  .refs { width:228px; }
  .refs .row { display:grid; grid-template-columns:repeat(3, 1fr); row-gap:10px; column-gap:6px; }
  .refs figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .refs .g { height:40px; display:flex; align-items:flex-start; padding-top:4px; }
  .refs figcaption { white-space:nowrap; color:#5f5e58; }
  .refs figure.pick figcaption { color:#141413; font-weight:600; }
  .refs .note { margin-top:8px; color:#8a877d; font-size:11px; }
  /* 变体选择器 */
  .picker { position:fixed; right:32px; bottom:28px; z-index:11; display:flex; align-items:center; gap:6px; background:#141413; color:#f4f2ea; border-radius:999px; padding:6px 8px 6px 14px; box-shadow:0 8px 28px rgba(0,0,0,.25); font: 13px/1 -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  .picker .lab { color:#a9a69c; margin-right:4px; }
  .picker button { color:#f4f2ea; padding:7px 12px; border-radius:999px; }
  .picker button:hover { background:#2a2925; }
  .picker button[aria-pressed="true"] { background:#f4f2ea; color:#141413; font-weight:600; }
  .picker .sep { width:1px; height:18px; background:#3a3934; margin:0 4px; }
  body.clean .picker, body.clean .refs { display:none; }
  body.norefs .refs { display:none; }
</style>

        label: viewRect(m.el.querySelector(".mark-label"))
      };
    });
    ns.markLayerCount = () => marksLayer?.childElementCount ?? 0;
    ns.marksState = () => liveMarks.map((m) => {
      const node = m.observedNode instanceof Range ? m.observedNode.commonAncestorContainer : m.observedNode;
      const anchor = node ? node instanceof Element ? node : node.parentElement : liveAnchor(m);
      return {
        label: m.label ?? "",
        element: anchor?.isConnected ? { tag: anchor.tagName.toLowerCase(), name: actionName(anchor) } : null,
        shown: m.el.isConnected && m.el.style.visibility !== "hidden"
      };
    });
    ns.setMarkConfig = (opts) => {
      defaultMarkOptions = { ...defaultMarkOptions, ...opts };
    };
    ns.getMarkConfig = () => ({ ...defaultMarkOptions });
    ns.markDetails = () => liveMarks.map((m) => {
      const svg = m.el.querySelector("svg.sketch-svg");
      const boilPaths = svg ? [...svg.querySelectorAll(".boil-path")] : [];
      const framePath = svg?.querySelector(".sketch-frame-path");
      const labelEl = m.el.querySelector(".sketch-label") ?? m.el.querySelector(".mark-label");
      return {
        className: m.el.className,
        hasSvg: Boolean(svg),
        isGrow: m.el.classList.contains("grow"),
        isBoil: m.el.classList.contains("boil"),
        isSketch: m.el.classList.contains("sketch"),
        hasFrame: Boolean(framePath),
        boilFrameCount: boilPaths.length,
        labelText: labelEl?.textContent ?? ""
      };
    });
  })();
})();
</script>
<script>
(function () {
  const P = window.__BYS_PROTO, q = P.q, size = P.size;
  const VISUAL = {"path":"M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z","white":2.2,"halo":3.8,"tip":{"x":4.037,"y":4.688}};
  const $ = (s) => document.querySelector(s);

  // ── 尺寸对照卡：同一条路径、同一组描边，1:1 渲染；macOS / OpenAI 箭头为重绘示意 ──

  }
  // macOS 箭头（按 1× 系统尺寸重绘：黑填白边，箭头高约 18px）
  const MAC = `<svg width="16" height="24" viewBox="-1.5 -1.5 16 24" style="overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))"><path d="M0 0v16.6l3.9-3.6 2.6 6.1 2.6-1.1-2.6-5.9h5.4z" fill="#000" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  // OpenAI 风格普通箭头（ChatGPT 智能体里的白边黑箭头，重绘示意，约 19px）
  const OAI = `<svg width="18" height="24" viewBox="-2 -2 18 24" style="overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))"><path d="M.5.5 13.2 12.4l-5.6.5 3.2 6-2.3 1.2-3.1-6.1L1.2 17.7z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  $("#refs").innerHTML = `<h5>尺寸对照（1:1）</h5><div class="row">
    <figure><div class="g">${MAC}</div><figcaption>macOS 箭头</figcaption></figure>
    <figure><div class="g">${OAI}</div><figcaption>OpenAI 箭头</figcaption></figure>

  const go = (patch) => { const u = new URL(location.href); for (const [k, v] of Object.entries(patch)) v === null ? u.searchParams.delete(k) : u.searchParams.set(k, v); location.href = u.toString(); };
  pk.innerHTML = `<span class="lab">光标</span>` + [18, 19, 20, 35].map(n => `<button data-size="${n}" aria-pressed="${n === size}">${n === 35 ? "当前 35" : n + "px"}</button>`).join("") +

    else if (b.id === "rm") go({ reduced: q.has("reduced") ? null : "" });

  // 发送按钮在原型里永远不做事。
  $("#sendBtn").addEventListener("click", (e) => e.preventDefault());

  // ── 演示脚本：只调真实 cursor API（beginAction / move / endAction），和产品里一次填写、一次悬停的顺序一致 ──

  const DRAFT = "好的，周四下午 3 点没问题，4F 小会议室见。新截图我会提前发你。";
  let runId = 0;

    document.querySelectorAll(".xhair").forEach(n => n.remove());

  }

  async function run() {
    const my = ++runId; const alive = () => my === runId;

    c.endAction("p1", "done", [x, y]);
    await sleep(140); $("#reply").classList.add("on");
    await sleep(720); if (!alive()) return;

    window.__protoPhase = "fill";
