<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>By Your Side</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:flex;flex-direction:column;color:#35323c;background:#f5f4f8;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid #e0dce6;background:#fff}
#name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600}
#kind{color:#938b9e;font-size:12px}
#download{font:inherit;font-size:13px;border:1px solid #8975b2;border-radius:8px;padding:4px 14px;background:transparent;color:#655184;cursor:pointer}
#download:hover{background:#eee8f7}#download:focus-visible{outline:2px solid #8975b2;outline-offset:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.frame{flex:1;width:100%;border:0;background:#fff}
.doc{max-width:820px;width:100%;margin:0 auto;padding:28px 32px 64px;background:#fff;flex:1}
.doc h1,.doc h2,.doc h3{line-height:1.35}.doc a{color:#655184}
.doc pre{overflow:auto;padding:12px;border-radius:8px;background:#f5f4f8}.doc code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.doc table{border-collapse:collapse}.doc th,.doc td{border:1px solid #e0dce6;padding:4px 10px}.doc blockquote{margin:0;padding-left:14px;border-left:3px solid #e0dce6;color:#77717f}
.text{margin:0;flex:1;overflow:auto;padding:20px 24px;background:#fff;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:4}
.image{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}.image img{max-width:100%;max-height:100%;background:#fff}
.missing{margin:18vh auto;text-align:center;color:#77717f}.missing strong{display:block;margin-bottom:6px;color:#35323c;font-size:18px;font-weight:600}
[hidden]{display:none!important}
</style></head><body><header><div id="name"></div><span id="kind"></span><button id="download" type="button" hidden>下载</button></header><main id="view"></main><script type="module" src="artifact-viewer.js"></script></body></html>
