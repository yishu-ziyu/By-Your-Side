<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开启麦克风 · By Your Side</title><link rel="stylesheet" href="styles.css"><style>
*{box-sizing:border-box}body{margin:0;color:var(--text-primary);background:var(--wallpaper);font:15px/1.8 var(--font)}main{max-width:500px;margin:12vh auto;padding:32px}small{color:var(--text-tertiary)}h1{font-size:25px;font-weight:600;margin:16px 0}p{color:var(--text-secondary)}button{font:inherit;border:1px solid var(--content-border);border-radius:12px;padding:9px 18px;background:var(--content-subtle);color:var(--accent);cursor:pointer}button:disabled{opacity:.6;cursor:default}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#status{margin:24px 0;color:var(--text-secondary)}#help{border-top:1px solid var(--content-border);padding-top:10px;font-size:13px}#done{margin-left:8px;background:transparent}[hidden]{display:none!important}</style></head><body><main><small>By Your Side</small><h1>开启麦克风</h1><p>Chrome 需要在这个页面完成首次授权。授权完成后回到侧栏，再开始语音对话。</p><button id="enable" type="button">允许使用麦克风</button><button id="done" type="button" hidden>返回侧栏</button><div id="status" role="status">此页只检查授权，拿到麦克风后立即释放，不录音、不上传。</div><div id="help" hidden><p>在 Chrome 麦克风设置中，检查 By Your Side 是否被阻止。如果 Chrome 还是用不了麦克风，<span id="os-help">打开系统的麦克风设置，检查 Chrome 的权限</span>。</p><button id="settings" type="button">打开 Chrome 麦克风设置</button></div></main><script type="module" src="voice-permission.js"></script></body></html>
