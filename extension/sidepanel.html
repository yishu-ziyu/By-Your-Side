<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>By Your Side</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- SVG 滤镜定义 (物理级透镜折射) -->
    <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
      <defs>
        <filter id="liquid-refraction" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" result="noise" seed="7" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" result="displaced" />
          <feGaussianBlur in="displaced" stdDeviation="0.3" result="smooth" />
          <feMerge>
            <feMergeNode in="smooth" />
          </feMerge>
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
