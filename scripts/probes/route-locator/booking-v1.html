<!doctype html><meta charset="utf-8"><title>会议室预订</title><h1>会议室预订</h1>
<form><label>日期 <input type="date" name="date"></label><label>时间 <select name="time"><option>15:00</option><option>16:00</option></select></label>
<label>楼层 <select name="floor"><option>3 楼</option><option>5 楼</option></select></label><div class="room"><h3>青松</h3><small>3F-A · 8 人</small><button>选择</button></div><div class="room"><h3>白桦</h3><small>3F-B · 12 人</small><button>选择</button></div><div class="room"><h3>银杏</h3><small>5F · 30 人</small><button>选择</button></div>
<label>会议主题 <input name="topic" placeholder="例如：项目周会"></label><button type="submit">预订</button></form>
