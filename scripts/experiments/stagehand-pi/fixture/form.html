<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stagehand probe — no-submit form</title>
  </head>
  <body>
    <h1>Local probe form (never submits)</h1>
    <form id="profile" action="/should-not-be-reached" method="post">
      <label>First name <input id="firstName" name="firstName" /></label>
      <label>Last name <input id="lastName" name="lastName" /></label>
      <label>Email <input id="email" name="email" /></label>
      <label>City <input id="city" name="city" /></label>
      <button id="save" type="submit">Save</button>
    </form>
    <!-- 探针没有 page.evaluate（SDK 的 Page 不暴露它），所以状态渲染进 DOM，用 locator.textContent() 读。 -->
    <pre id="probe-state"></pre>
    <script>
      // 观测层：记录是否发生提交、哪些字段被写入。页面本身永不真正提交。
      window.__probe = { submits: 0, writes: [], navigations: 0 };
      const probe = window.__probe;
      const stateNode = document.getElementById("probe-state");
      const render = () => {
        stateNode.textContent = JSON.stringify({
          values: Object.fromEntries(
            [...document.querySelectorAll("input")].map((el) => [el.id, el.value]),
          ),
          submits: probe.submits,
          navigations: probe.navigations,
          writes: probe.writes.slice(),
          focused: document.activeElement ? document.activeElement.id : null,
        });
      };
      const record = (el, kind) => {
        probe.writes.push({ id: el.id, kind, value: el.value, at: Date.now() });
        render();
      };
      for (const el of document.querySelectorAll("input")) {
        el.addEventListener("input", () => record(el, "input"));
        el.addEventListener("change", () => record(el, "change"));
      }
      document.getElementById("profile").addEventListener("submit", (event) => {
        event.preventDefault(); // 永不真正提交
        probe.submits += 1;
        render();
      });
      window.addEventListener("beforeunload", () => { probe.navigations += 1; });
      window.__probeState = () => ({
        values: Object.fromEntries(
          [...document.querySelectorAll("input")].map((el) => [el.id, el.value]),
        ),
        submits: probe.submits,
        navigations: probe.navigations,
        writes: probe.writes.slice(),
        url: location.href,
        focused: document.activeElement && document.activeElement.id,
      });
      render();
    </script>
  </body>
</html>
