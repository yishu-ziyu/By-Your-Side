name: Documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:docs
      - run: npm run check:docs
      - name: Feature documentation sync
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run check:docs -- --base "$DOCS_BASE"
