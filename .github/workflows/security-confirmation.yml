name: Security confirmation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:architecture
      - run: npm run check:docs
      - name: Feature documentation sync
        if: github.event_name == 'pull_request'
        env:
          DOCS_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run check:docs -- --base "$DOCS_BASE"
      - run: npm run build
      - run: npx --yes playwright install --with-deps chromium
      - name: Locate Chrome for Testing
        run: echo "EGO_ACCEPTANCE_CHROME=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)" >> "$GITHUB_ENV"
      - run: node --import tsx scripts/acceptance/security-confirmation.mts --headless
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-confirmation-evidence
          path: out/security-confirmation/
          if-no-files-found: warn
