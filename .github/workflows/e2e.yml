name: E2E (isolated, no credentials)
# Manual trigger until the first green run on Linux; then add pull_request/push.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes playwright install --with-deps chromium
      - name: Locate Chrome for Testing
        run: echo "EGO_ACCEPTANCE_CHROME=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)" >> "$GITHUB_ENV"
      # The isolated tool-layer suite (accept:isolated) was deleted 2026-10-04 with the tools it covered
      # (docs/evals/20261004-cut-unused.md). Real-path cases install only the extension and use a scripted model.
      # The core set lives in run-all.mts (CORE). Not yet run on Linux.
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-isolated-evidence
          path: out/
          if-no-files-found: ignore
