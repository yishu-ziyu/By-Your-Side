name: E2E (isolated, no credentials)
# Keep real-browser acceptance manually triggered.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Acceptance cases to run
        type: choice
        default: core
        options:
          - core
          - session-durability
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes playwright install --with-deps chromium
      - name: Locate Chrome for Testing
        run: echo "EGO_ACCEPTANCE_CHROME=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)" >> "$GITHUB_ENV"
      # Real-path cases install only the extension and use a scripted model.
      # The core set lives in run-all.mts (CORE).
      - name: Core acceptance
        if: inputs.suite == 'core'
        run: npm test
      - name: Session recovery acceptance
        if: inputs.suite == 'session-durability'
        run: npx tsx scripts/acceptance/real-path/session-durability.mts --headless
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-isolated-evidence
          path: out/
          if-no-files-found: ignore
